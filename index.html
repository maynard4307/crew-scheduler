/* ---------- roster backup / restore ---------- */
function rosterBackup(){
  return JSON.stringify({app:"crew-scheduler",kind:"roster",version:2,exportedAt:new Date().toISOString(),
    roster:{workers:roster.workers,conflicts:roster.conflicts,prefers:roster.prefers,settings:roster.settings},places,
    history:{days:[...HIST.values()].sort((a,b)=>a.date.localeCompare(b.date))}},null,1);
}
function workersCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Name","Address","Lat","Lng","Phone","Lead","Active","Max miles"]];
  [...roster.workers].sort((a,b)=>a.name.localeCompare(b.name)).forEach(w=>rows.push([w.name,w.address||"",hasLoc(w)?w.lat:"",hasLoc(w)?w.lng:"",w.phone||"",w.lead?"yes":"",w.active===false?"no":"yes",w.maxMiles||""]));
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
function readBackup(text){
  let d;try{d=JSON.parse(String(text||"").replace(/^\uFEFF/,"").trim())}catch(e){throw new Error("That isn't a Crew Scheduler backup.")}
  const r=d&&(d.roster||(Array.isArray(d.workers)?d:null));
  if(!r||!Array.isArray(r.workers))throw new Error("That isn't a Crew Scheduler backup.");
  const clean=w=>({id:cleanId(w.id)||uid(),name:String(w.name||"Unnamed").slice(0,80),address:String(w.address||"").slice(0,200),
    lat:typeof w.lat==="number"&&Math.abs(w.lat)<=90?w.lat:null,lng:typeof w.lng==="number"&&Math.abs(w.lng)<=180?w.lng:null,
    phone:String(w.phone||"").slice(0,40),lead:!!w.lead,active:w.active!==false,maxMiles:+w.maxMiles>0?+w.maxMiles:0,geoNote:w.geoNote?String(w.geoNote).slice(0,200):"",geoLabel:w.geoLabel?String(w.geoLabel).slice(0,300):""});
  const pairs=a=>Array.isArray(a)?a.filter(p=>Array.isArray(p)&&p.length===2).map(p=>[cleanId(p[0]),cleanId(p[1])]).filter(p=>p[0]&&p[1]):[];
  return {workers:r.workers.map(clean),conflicts:pairs(r.conflicts),prefers:pairs(r.prefers),settings:r.settings&&typeof r.settings==="object"?r.settings:null,
    places:Object.fromEntries(Object.entries(d.places&&typeof d.places==="object"?d.places:{}).filter(([k,v])=>v&&isFinite(+v.lat)&&isFinite(+v.lng)&&Math.abs(+v.lat)<=90&&Math.abs(+v.lng)<=180).map(([k,v])=>[String(k).slice(0,200),{lat:+v.lat,lng:+v.lng,name:String(v.name||"").slice(0,80),at:String(v.at||"")}])),historyDays:d.history&&Array.isArray(d.history.days)?d.history.days:[]};
}
/* Rows left behind when a backup .json was opened with "Import list (CSV)" before 2026.11.09-g:
   names like "{", "]", "name: Curtis danley", "lat: 35.03", "roster: {". */
const JUNK_ROW=/^[\[\]{}(),\s]*$|^"?[A-Za-z]+"?\s*:(\s|$)/;
const isJunkWorker=w=>JUNK_ROW.test(String(w.name||"").trim())&&!w.address&&!hasLoc(w);
async function restoreRoster(text){
  let b;try{b=readBackup(text)}catch(e){logEvent("restore-error",e.message);toast(e.message);return}
  const junk=roster.workers.filter(isJunkWorker);
  if(junk.length){
    const ids=new Set(junk.map(w=>w.id));
    roster.workers=roster.workers.filter(w=>!ids.has(w.id));
    roster.conflicts=roster.conflicts.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));roster.prefers=roster.prefers.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));
    logEvent("restore",`Removed ${junk.length} broken rows from an earlier backup import`);
    save("roster");render();
  }
  const mode=roster.workers.length?await ask(`This backup has ${b.workers.length} worker${b.workers.length===1?"":"s"}. Merge adds its new people and updates people with the same name from the file; your settings stay as they are. Replace removes everyone on this device and uses the backup instead, settings included.`,"Replace","Merge",{altPrimary:true}):true;
  if(mode===null)return;
  if(mode){
    roster.workers=b.workers;roster.conflicts=b.conflicts;roster.prefers=b.prefers;
    if(b.settings)roster.settings={...DEFAULT_SETTINGS,...b.settings};
    tonight.assign=null;tonight.locks={};
  } else {
    const idMap=new Map();let added=0,updated=0;
    for(const w of b.workers){
      const ex=roster.workers.find(x=>x.id===w.id)||roster.workers.find(x=>x.name.trim().toLowerCase()===w.name.trim().toLowerCase());
      if(ex){idMap.set(w.id,ex.id);const keep=ex.id;Object.assign(ex,w,{id:keep});updated++}
      else{const nid=roster.workers.some(x=>x.id===w.id)?uid():w.id;idMap.set(w.id,nid);roster.workers.push({...w,id:nid});added++}
    }
    const addPairs=(src,dst)=>{for(const [a,c] of src){const A=idMap.get(a),C=idMap.get(c);if(A&&C&&A!==C&&!dst.some(p=>pairKey(p[0],p[1])===pairKey(A,C)))dst.push([A,C])}};
    addPairs(b.conflicts,roster.conflicts);addPairs(b.prefers,roster.prefers);
    toast(`${added} added, ${updated} updated`);
  }
  let pn=0;for(const [k,v] of Object.entries(b.places||{})){if(!places[k]||String(places[k].at||"")<v.at){places[k]=v;pn++}}if(pn)lsSet("crew_places",places);
  const hn=mergeHistory(b.historyDays);if(hn)setTimeout(()=>toast(`Also restored ${hn} day(s) of history`),2700);
  logEvent("restore",(mode?"replace":"merge")+` ${b.workers.length} workers, ${hn} history days`);
  normalize();save("roster");save("tonight");render();
  if(mode)toast(`Restored ${b.workers.length} worker${b.workers.length===1?"":"s"} and their crew rules`);
}

async function loadPackJobs(text,rosterText,source){

    if(r===null)return;

    const req=ids(j.requested),av=ids(j.avoid);lostPeople+=(Array.isArray(j.requested)?j.requested.length:0)-req.length+(Array.isArray(j.avoid)?j.avoid.length:0)-av.length;
    return {id:cleanId(j.id)||uid(),name:str(j.name,300)||"Job",title:str(j.title,500),time:str(j.time,20),day:str(j.day,20),address:str(j.address,300),place:str(j.place,200),
      multi:str(j.multi,30),lat:ok?lat:null,lng:ok?lng:null,geoNote:str(j.geoNote,200),geoLabel:str(j.geoLabel,300),desc:str(j.desc,1500),folder:str(j.folder,200),
      crew:Math.max(1,Math.min(20,j.crew|0||S().defaultCrew)),trucks:Math.max(1,Math.min(20,j.trucks|0||1)),requested:req,avoid:av,aiNote:str(j.aiNote,500),on:j.on!==false};
  });
  tonight.day=isDayKey(d.day)?d.day:undefined;tonight.off=ids(d.off);tonight.offAt=new Date().toISOString();tonight.assign=null;tonight.locks={};tonight.meets={};delete tonight.aiReview;
  tonight.importedAt=new Date().toISOString();tonight.source=source;
  logEvent("import",`pack jobs from ${source}: ${tonight.jobs.length} jobs`);
  save("tonight");tab="tonight";render();
  toast(`${tonight.jobs.length} job(s) loaded from the pack${lostPeople?` · ${lostPeople} requested/don't-send name(s) not found in your workers`:""} — press Build crews`);
  if(tonight.jobs.some(j=>!hasLoc(j)&&(j.address||j.place)))geocodeMissing("jobs");
}

  if(el.id==="schedDate"){if(isDayKey(el.value))setScheduleDay(el.value);return}
  if(el.classList.contains("histNote")){const d=el.dataset.d,i=+el.dataset.i;const v=el.value.trim();const j=HIST.get(d).jobs[i];if((j.note||"")!==v)histEdit(d,c=>{c.jobs[i].note=v},`${j.name}: note “${v}”`);return}
  if(el.id==="histLoad"){const f=el.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);const days=d.days||(d.history&&d.history.days)||[];const n=mergeHistory(days);render();toast(n?`Loaded ${n} day(s) of history`:"Nothing new in that file")}).catch(()=>toast("That isn't a Crew Scheduler history file"));return}
  if(el.dataset.act==="jobCrew"){const j=jById(el.dataset.id);j.crew=Math.max(1,Math.min(20,Math.round(+el.value)||1));save("tonight");setTimeout(render,0);return}
  if(el.dataset.act==="jobTrucks"){const j=jById(el.dataset.id);j.trucks=Math.max(1,Math.min(20,Math.round(+el.value)||1));save("tonight");setTimeout(render,0);return}
  if(el.dataset.act==="assignTo"){const wid=el.value,jid=el.dataset.j;if(!wid)return;
    for(const k in tonight.assign)tonight.assign[k]=tonight.assign[k].filter(x=>x!==wid);
    tonight.assign[jid].push(wid);tonight.locks[wid]=jid;save("tonight");render();return}
  if(el.dataset.agf){const a=(S().agencies||[]).find(x=>x.id===el.dataset.ag);if(!a)return;const f=el.dataset.agf;const v=el.value.trim().slice(0,f==="name"||f==="phone"?(f==="name"?80:40):200);if((a[f]||"")===v)return;a[f]=v;
    if(agencyList().length)$("#agWarn")?.remove();
    if(f==="address"){a.lat=null;a.lng=null;a.geoLabel="";save("roster");if(v)agencyLocate(a);else{const l=$("#agLoc-"+a.id);if(l){l.innerHTML=agLocText(a);l.classList.add("muted")}}}
    else{save("roster");if(f==="name"){const t=document.querySelector(`[data-agt="${a.id}"]`);if(t&&v)t.textContent=v}}return}
  if(el.dataset.set){const k=el.dataset.set;roster.settings[k]=el.type==="checkbox"?el.checked:Math.max(0,parseFloat(el.value)||0);if(k==="roadFactor"&&roster.settings[k]<1)roster.settings[k]=1;if(k==="defaultCrew"&&roster.settings[k]<1)roster.settings[k]=1;if(k==="avgMph"&&roster.settings[k]<5)roster.settings[k]=5;save("roster");if((tonight.assign&&tab==="tonight")||k==="tempAgency")render();return}

});
$("#fileJobs").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const {kind,text,roster:rt}=await readAnyFile(f);
    if(kind==="pack"){await loadPackJobs(text,rt,f.name);return}
    rawImportText=kind==="ics"?"":text;const p=placesFrom(kind,text);if(!p.length)throw new Error("No jobs found in that file.");await importPlaces(kind,p,f.name)}catch(err){logEvent("import-error",(err.message||err)+" — "+f.name);toast(err.message||"Couldn't read that file")}
});
$("#fileWorkers").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const {kind,text}=await readAnyFile(f);
    if(isBackupJSON(asJSON(text))){logEvent("import","Backup file opened with Import list — restoring it: "+f.name);restoreRoster(text);return}
    const p=placesFrom(kind,text).filter(x=>x.name&&x.name!=="Unnamed");if(!p.length)throw new Error("No people found in that file.");
    p.forEach(x=>{if(!x.address&&x.desc)x.address=x.desc.split("\n")[0].slice(0,120)});importWorkers(p)}catch(err){logEvent("import-error",(err.message||err)+" — "+f.name);toast(err.message||"Couldn't read that file")}
});

$("#appVer").textContent="v"+APP_VERSION;
(()=>{let seen=null;try{seen=localStorage.getItem("crew_seenver")}catch(e){}
  if(seen===APP_VERSION)return;
  const firstRun=!seen&&!(lsGet("crew_roster")||{}).workers?.length;
  if(firstRun){try{localStorage.setItem("crew_seenver",APP_VERSION)}catch(e){}return}  // brand-new user: no popup
  $("#appVer").classList.add("new");
  setTimeout(()=>showWhatsNew(seen),600);
})();
render();
initDB();
histInit();
</script>
</body>
