<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16191d;--muted:#5f6b78;--line:#e2e6eb;
  --accent:#1f6feb;--accent-ink:#fff;--warn:#b45309;--warn-bg:#fff7e6;--bad:#c62828;--bad-bg:#fdecec;--ok:#15803d;--ok-bg:#e9f7ee;
  --chip:#eef1f5;--radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--muted:#9aa5b1;--line:#2a3038;--accent:#4c8dff;--chip:#232932;
  --warn:#f5b454;--warn-bg:#2d2414;--bad:#ff7b7b;--bad-bg:#2e1717;--ok:#5fd08a;--ok-bg:#132619;}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0}
.brandWrap{display:flex;align-items:center;gap:10px;min-width:0}
.brand{width:40px;height:40px;flex:none;background:#fff;border-radius:9px;padding:2px;box-shadow:0 0 0 1px var(--line)}
@media (max-width:480px){.brand{width:34px;height:34px}.brandWrap{gap:8px}h1{font-size:16px;white-space:nowrap}h1 .ver{font-size:10px;padding:1px 6px;margin-left:2px}#saveState{font-size:11px;text-align:right;max-width:76px;line-height:1.25;margin-left:6px}}
@media (max-width:384px){h1{line-height:1.1}h1 .ver{display:table;margin:3px 0 0}}
.ver{font:inherit;font-size:11px;font-weight:500;color:var(--accent);margin-left:4px;white-space:nowrap;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer;vertical-align:2px}
.ver.new::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 4px;font:inherit;font-size:12px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cal .d.empty{background:transparent;border-color:transparent;cursor:default}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal .dots{display:flex;flex-wrap:wrap;gap:2px}
.cal .dot{width:7px;height:7px;border-radius:50%}
.st-done{background:#16a34a}.st-rain{background:#2563eb}.st-cancel{background:#9ca3af}.st-open{background:#f59e0b}
.stbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.stbtn.on.done{background:#16a34a;color:#fff;border-color:#16a34a}.stbtn.on.rain{background:#2563eb;color:#fff;border-color:#2563eb}.stbtn.on.cancel{background:#6b7280;color:#fff;border-color:#6b7280}
.rel h3{margin:14px 0 2px;font-size:15px}.rel ul{margin:4px 0 0;padding-left:20px}.rel li{margin:3px 0;font-size:14px}
.rel .lbl{font-size:12px;font-weight:700;margin-top:6px}
#saveState{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 8px;max-width:980px;margin:0 auto;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer}
@media (max-width:480px){nav{padding:0 2px;gap:0}nav button{padding:10px 7px;font-size:14px}}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:12px 0 6px}
.step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center;margin-right:6px;vertical-align:1px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
label.row.small{flex-wrap:nowrap;align-items:flex-start;gap:8px}
label.row.small input[type=checkbox]{margin-top:2px;flex:none;width:18px;height:18px}
button.b,label.b,summary.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;min-width:34px;min-height:34px}
@media (pointer:coarse){button.x{min-width:40px;min-height:40px}}
.item>input[type=checkbox]{width:22px;height:22px;flex:none}
a{color:var(--accent)}
[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.b:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=tel],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{width:72px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.dayPick .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayPick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chip.off{background:transparent;color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.lead{background:var(--ok-bg);color:var(--ok)}
.tag.lock{background:var(--chip);color:var(--accent)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.bad{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.good{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.job{border:1px solid var(--line);border-left:5px solid var(--c,#888);border-radius:10px;padding:10px;background:var(--bg)}
.job .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job .nm{font-weight:700;overflow-wrap:anywhere}
.mem{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.mem:first-of-type{border-top:0}
.mem .n{flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{font-size:18px;display:block}
.stat span{font-size:12px;color:var(--muted)}
svg.map{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
details summary{cursor:pointer;font-weight:600}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;border:1px solid var(--line);outline:0}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;max-width:100%;pointer-events:auto;cursor:pointer;display:flex;gap:12px;align-items:center}
.toast.multi{flex-wrap:wrap;gap:8px 10px}.toast.multi span{flex:1 1 100%}
.avx{display:inline-flex;align-items:center;gap:2px;margin-right:6px;white-space:nowrap}
.avx button{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:2px 7px;min-height:28px;border-radius:6px}
.toast button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:7px;padding:4px 10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.hide{display:none!important}
ol.help li{margin-bottom:8px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px;overflow-wrap:anywhere}
.card[id]{scroll-margin-top:96px}
.step.done{background:var(--ok)}
.stepDone{cursor:pointer;padding:10px 14px}
.jtBox{border:1px dashed var(--accent);border-radius:var(--radius);padding:10px;margin-bottom:6px}
.jtBox textarea{min-height:56px}
.stepDone .sum{flex:1;min-width:0;color:var(--muted);font-size:14px}
details.more{position:relative;display:inline-block}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more .menu{position:absolute;z-index:8;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:190px}
details.more .menu .b{width:100%;text-align:left}
#actionBar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#actionBar .in{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:center}
#actionBar .b{flex:1;justify-content:center;text-align:center}
#actionBar .hint{flex:1;font-size:13px;color:var(--muted)}
body.hasBar main{padding-bottom:90px}
body.hasBar #toasts{bottom:84px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.secHd{margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
details.hsec{border-top:1px solid var(--line);padding:8px 0}
details.hsec>summary{font-weight:600;cursor:pointer;padding:4px 0}
.sendRow{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
</style>
</head>

<script>
"use strict";
/* ---------- state ---------- */
const APP_VERSION="2026.11.17-a";
/* Release notes — newest first. Add an entry here with every update. */
const CHANGELOG=[
 {v:"2026.11.17-a",date:"Nov 17, 2026",fixed:["When road drive times fail, the message now says the real reason. Before, it always said “Couldn't reach OpenRouteService… use the website version”, even on the website. Now it tells apart: the key in this browser isn't accepted or today's free limit is used up (with a link to Settings → Road drive times to test or re-paste the key), the device is offline, the service can't be reached, or you're on the shared Claude page. The Test button in Settings gives the same clearer answer."]},
 {v:"2026.11.16-b",date:"Nov 16, 2026",added:["After you take someone off a crew with ×, the message now has a second button: Keep off this job. Tap it and a rebuild won't put that person back on that job today. They can still go to another job.", "A job's “Don't send” names now each have a small × so you can allow that person on the job again.", "On a phone, Save backup file (and the History backup) now opens the Share sheet, so you can text or email the backup to yourself, AirDrop it, or Save to Files. On a computer it still downloads as before.", "The tool that opens .kmz map files and .zip files is now built into the app, so those open with no internet, and the app no longer loads any code from another website."],fixed:["If you close the Share sheet without saving the backup, the app no longer counts it as backed up."]},
 {v:"2026.11.16-a",date:"Nov 16, 2026",added:["Rebuild now keeps people where they already are unless moving someone saves real driving, and a message says who changed jobs. Before, a rebuild could reshuffle people who had already been told where to go.","Taking someone off a crew with × now shows an Undo button for a few seconds, and the ×, 🔒 and tick boxes are bigger and easier to hit on a phone.","When two people on a job have the same first name, the copied schedule adds the last initial (Mike S., Mike T.).","When you restore a backup and already have workers, Merge is now the highlighted button, and the message explains what Merge and Replace each do.","Pop-ups close with the Esc key, and the folded steps and job rows can be reached with the keyboard.","Settings → Backup & restore notes that on an iPhone, Safari and the Home Screen icon each keep their own data."],fixed:["A crew lead could be given a truck on a job past their mile limit: on a short-handed day a far-away lead was pulled in to fill an empty seat and ended up driving the second truck, and the extra truck option didn't check the limit at all. Now a lead past their limit never drives unless you put them there yourself. They may still ride along as a worker.","In the “+ Add / move someone here” menu, the “past limit” note compared minutes with miles, so some leads were marked past their limit when they weren't.","What you were typing could disappear: if the app finished looking up addresses while you were filling in Add a job or Add worker, the form went blank. The form now keeps what you typed. The temp agency boxes and the AI “Anything special today?” box no longer lose text either.","Switching tabs with a half-filled job or worker now asks before throwing it away.","On a phone, the More menu in step 1 ran off the right edge of the screen. It now stays on screen.","Links were dark blue on a dark background in dark mode and hard to read. They're now light blue.","More → Clear crews wiped the crews and locks at once. It now asks first.","Changing Trucks or Per truck on a job before building crews didn't update the counts in step 2.","Two jobs with the same name and time on one day could swap or lose their close-out status in History when the schedule was saved again.","Deleting a worker left an empty “Don't send:” line on jobs and kept them in the off list.","Loading new jobs now clears an old AI review, and applying an old suggestion no longer takes someone off their job.","Backup and spreadsheet file names used the wrong date in the evening. The crews spreadsheet is now named for the day being scheduled.","In plain-English job entry, the basic reader read “at 5” as 5:00p. It now reads it as 5:00a, the same as the Report time box.","Safety: odd characters in the IDs inside a backup or support pack file are now removed when the file is loaded."]},
 {v:"2026.11.15-a",date:"Nov 15, 2026",added:["New Temp agency setting (Settings → Temp agency). Add one or more temp agencies with their name, phone, address and a note. Off until you turn it on.","When there aren't enough workers, the app now says so: step 2 shows how many worker spots there are to fill and how many people are available, and after Build crews a note lists how many workers each job is short. The copied schedule ends with a “SHORT-HANDED” list. If the temp agency setting is off, it offers to turn it on.","With the temp agency setting on, open worker spots show as “Temp worker” on the crews, the copied schedule and the CSV, meeting the crew at the job before report time. The app suggests the agency closest to each job and lists who to call and how many temps for which job. Temps only fill worker spots: every truck still needs one of your crew leads.","History notes how many temp workers a job used and from which agency."]},
 {v:"2026.11.14-a",date:"Nov 14, 2026",added:["Backup reminder: if your workers haven't been backed up in a week, Today shows a reminder with a Save backup file button. Settings → Backup & restore shows when the last backup was made.","A job that runs several days on the calendar (one event from Monday to Friday), or one that repeats, now shows up on every day it covers when you open the job file. It's marked “day 2 of 5” or “repeats” in the job list.","From 3 p.m. on, “Scheduling for” starts on Tomorrow, since the next day's jobs come in at night. Tap Today if you mean today.","Removing a job with × now shows an Undo button for a few seconds.","Messages at the bottom of the screen stay up longer when they're long, and you can tap one to dismiss it."],fixed:["If the phone or browser ran out of storage space, changes could fail to save while the top still said “Saved”. The app now clears out old remembered lookups to make room by itself, and if a save still fails it shows a red “NOT SAVED” warning telling you to save a backup file.","A job with no map location was left off the crews and the copied schedule without a word, and the screen still said every truck was covered. Now a red note lists any job that isn't on the schedule, and the copied schedule ends with a “NOT SCHEDULED YET” list.","If yesterday's jobs were still loaded and you typed in new ones, the schedule went out with yesterday's date and was saved over yesterday in History. Now a red note warns when the day has already passed, with a Start new day button, and Copy schedule asks before using an old date.","Unticking a job after crews were built left it in the crews and in the copied schedule until you rebuilt. Now it comes off right away and its people are free.","When you load a new day's jobs, the app asks whether to keep the people who were marked off before, so nobody stays off by accident.","A report time typed without a or p (like 7:00 or 0700) gave no leave-by times. It's now read as a morning time (7:00a) and tidied when you save, and a time that can't be read is flagged on the job.","“Delete everything” now also clears saved map spots, remembered address lookups and drive times, the last calendar import and the support log. Only your keys stay, and the screen says so.","The AI notes said no addresses are sent. To be exact: job-site addresses and the calendar notes are sent to the AI when you use it; workers' home addresses and phone numbers never are. The wording now says that."]},
 {v:"2026.11.12-a",date:"Nov 12, 2026",added:["New “Scheduling for” choice at the top of step 1 on Today: tap Today or Tomorrow, or pick any date. Jobs you add by hand go on that day, and the copied schedule and History use that date. Step 1 and 2 titles say which day you're working on.","When you open a job file, the day list starts on the day you picked, and loading a day's jobs sets “Scheduling for” to match. If loaded calendar jobs are for a different day than the one picked, a note says so."]},

/* Small rolling log of errors and key actions, kept on this device for support packs. */
const LOG=(()=>{try{return JSON.parse(localStorage.getItem("crew_log"))||[]}catch(e){return []}})();
function logEvent(type,msg,extra){
  try{LOG.push({t:new Date().toISOString(),type,msg:String(msg).slice(0,500),...(extra?{extra}:{})});while(LOG.length>300)LOG.shift();localStorage.setItem("crew_log",JSON.stringify(LOG))}catch(e){}
}
window.addEventListener("error",e=>logEvent("error",e.message,{src:(e.filename||"").split("/").pop(),line:e.lineno,col:e.colno,stack:e.error&&e.error.stack?String(e.error.stack).slice(0,800):""}));
window.addEventListener("unhandledrejection",e=>logEvent("error","Unhandled: "+(e.reason&&e.reason.message||e.reason),{stack:e.reason&&e.reason.stack?String(e.reason.stack).slice(0,800):""}));

/* A lead's own limit (set on the lead) wins over the default. 0 = no limit. */

/* Backup reminder: everything lives in this one browser, so nudge when the workers haven't been backed up lately. */
const BACKUP_DAYS=7;
function backupInfo(){return lsGet("crew_backup")||{}}
function markBackedUp(){const b=backupInfo();b.at=new Date().toISOString();b.n=roster.workers.length;delete b.snooze;lsSet("crew_backup",b)}
function backupDue(){
  const real=roster.workers.filter(w=>!/\(sample\)$/.test(w.name||""));if(real.length<3)return null;
  const b=backupInfo();if(b.snooze&&Date.now()<b.snooze)return null;
  if(!b.at)return {never:true};
  const days=Math.floor((Date.now()-new Date(b.at).getTime())/864e5);
  return days>=BACKUP_DAYS?{days}:null;
}
function backupBanner(){

}

let editingJob=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Ids read from a file (backup, support pack) are cut down to letters, digits, - and _ before they are used on the page. */

/* ---------- persistence ---------- */
let db=null, dbOK=false;
const saveTimers={}, lastWritten={}, writing={};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function setSave(t){const el=$("#saveState");el.textContent=saveFailed?"⚠ NOT SAVED":t;el.style.color=saveFailed?"var(--bad)":""}
/* The browser gives each site a few MB. When it is full a save fails: first drop what can be looked up again
   (address lookups, road times, the last import, the log), then try once more. If it still fails, say so loudly —
   never show "Saved" for something that wasn't. */
let saveFailed=false;
function freeSpace(){
  try{for(const k in geoCache)delete geoCache[k];for(const k in RG)delete RG[k];for(const k in RC)delete RC[k];LOG.length=0;
    ["crew_geo","crew_rg","crew_rc","crew_lastimport","crew_log"].forEach(k=>localStorage.removeItem(k))}catch(e){}
}
function lsSave(k,v){
  let ok=lsSet(k,v);
  if(!ok){freeSpace();ok=lsSet(k,v);logEvent(ok?"storage":"error",ok?"Storage was full — cleared remembered lookups and drive times to make room":"Save failed: browser storage is full or blocked ("+k+")")}
  const was=saveFailed;saveFailed=!ok;
  if(was!==saveFailed)setTimeout(render,0);
  return ok;
}
const saveFailBanner=()=>saveFailed?`<div class="bad" style="margin:0 0 10px;font-size:14px"><b>⚠ Your last changes are NOT saved.</b> This browser's storage for the app is full or blocked (private browsing can cause this). Don't close the app: go to <a href="#" data-act="jump" data-to="backupCard">Settings → Backup &amp; restore</a> and tap <b>Save backup file</b> now so nothing is lost, then send a support pack.</div>`:"";
function normalize(){
  roster.workers=roster.workers||[];roster.conflicts=roster.conflicts||[];roster.prefers=roster.prefers||[];
  if(roster.settings&&roster.settings.maxLeadMiles===undefined)roster.settings.maxLeadMiles=roster.settings.maxMiles||0;
  roster.settings={...DEFAULT_SETTINGS,...(roster.settings||{})};
  delete roster.settings.requireLead;
  roster.settings.agencies=(Array.isArray(roster.settings.agencies)?roster.settings.agencies:[]).filter(a=>a&&typeof a==="object").map(a=>({id:cleanId(a.id)||uid(),name:String(a.name||"").slice(0,80),address:String(a.address||"").slice(0,200),phone:String(a.phone||"").slice(0,40),note:String(a.note||"").slice(0,200),
    lat:typeof a.lat==="number"&&Math.abs(a.lat)<=90?a.lat:null,lng:typeof a.lng==="number"&&Math.abs(a.lng)<=180?a.lng:null,geoLabel:String(a.geoLabel||"").slice(0,300)}));
  tonight.jobs=tonight.jobs||[];tonight.jobs.forEach(j=>{if(!j.trucks)j.trucks=1});tonight.locks=tonight.locks||{};tonight.off=tonight.off||[];tonight.drivers=tonight.drivers||{};
}
function save(which){
  const obj=which==="roster"?roster:tonight;
  lsSave("crew_"+which,obj);
  if(which==="roster")rosterChangedAt=Date.now();
  if(!dbOK){setSave("Saved on this device");return}
  clearTimeout(saveTimers[which]);
  setSave("Saving…");
  saveTimers[which]=setTimeout(()=>flush(which),700);
}
async function flush(which){
  if(writing[which]){saveTimers[which]=setTimeout(()=>flush(which),400);return}
  saveTimers[which]=null;
  const obj=which==="roster"?roster:tonight;
  const json=JSON.stringify(obj);
  if(json===lastWritten[which]){setSave("All changes saved");return}
  writing[which]=true;
  try{
    await db.doc("app/"+which).set(JSON.parse(json));
    lastWritten[which]=json;setSave("All changes saved");
  }catch(e){
    if(e&&e.code==="unavailable"){writing[which]=false;setTimeout(()=>flush(which),1500+Math.random()*1000);return}
    if(e&&e.code==="quota_exceeded")setSave("Storage full — remove old data");
    else setSave("Can't save to account (saved on this device)");
  }
  writing[which]=false;
}
async function initDB(){
  const lr=lsGet("crew_roster"),lt=lsGet("crew_tonight");
  if(lr)roster=lr; if(lt)tonight=lt; normalize(); render();
  setSave("Saved on this device");
  // ask the browser not to clear this site's data on its own (iPhones can do that to sites left unopened)
  try{if(navigator.storage&&navigator.storage.persist&&roster.workers.length)navigator.storage.persist().then(ok=>{storagePersisted=!!ok}).catch(()=>{})}catch(e){}
  if(!window.claude||!window.claude.use)return;
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db)return;
  let settled=false;
  const timer=setTimeout(()=>{if(!settled)setSave("Account storage not reachable — saving on this device")},10000);
  for(const which of ["roster","tonight"]){
    db.doc("app/"+which).onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      settled=true;clearTimeout(timer);dbOK=true;
      if(!snap.exists){
        const obj=which==="roster"?roster:tonight;
        const hasLocal=which==="roster"?obj.workers.length:obj.jobs.length;
        if(hasLocal)save(which); else setSave("All changes saved");
        return;
      }
      const data=snap.data();const json=JSON.stringify(data);
      if(json===lastWritten[which])return;
      if(saveTimers[which]||writing[which])return; // local edit in flight wins
      lastWritten[which]=json;
      if(which==="roster")roster=JSON.parse(json);else tonight=JSON.parse(json);
      normalize();lsSave("crew_"+which,which==="roster"?roster:tonight);
      if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();
      if(!snap.metadata||!snap.metadata.fromCache)setSave("All changes saved");
    },err=>{settled=true;clearTimeout(timer);dbOK=false;setSave("Saved on this device")});
  }
}

/* ---------- geo helpers ---------- */
function parseCoords(txt){
  if(!txt)return null;txt=String(txt).trim();
  let m=txt.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if(!m)m=txt.match(/[?&](?:q|ll|query|destination|center)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i);
  if(!m)m=txt.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(!m)m=txt.match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;
  const lat=+m[1],lng=+m[2];
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat,lng};
}
/* ---------- location checks ----------
   Typed addresses sometimes land in the wrong place (address ranges, highway numbers) or only match the town.
   locWarn() explains what looks off so the dispatcher can paste the exact spot from Google Maps. */
const FAR_MI=75;
function typedTown(addr){
  const a=String(addr||"");const zip=(a.match(/\b(\d{5})(?:-\d{4})?\b(?!.*\b\d{5}\b)/)||[])[1]||"";
  const ps=a.split(",").map(x=>x.trim());
  for(let i=1;i<ps.length;i++)if(/^(NC|SC|VA|GA|TN|North Carolina|South Carolina)(\s+\d{5}(-\d{4})?)?(\s+(USA|United States.*))?$/i.test(ps[i])){
    const t=ps[i-1];if(t&&!/\d/.test(t))return {town:t,zip};break}
  return {town:"",zip};
}
function labelPlace(label){
  const ps=String(label||"").split(",").map(x=>x.trim()).filter(Boolean);
  const c=ps.findIndex(x=>/County$/i.test(x));if(c>0)return ps[c-1];
  const st=ps.findIndex(x=>/^(North Carolina|South Carolina|Virginia|Georgia|Tennessee)$/i.test(x));if(st>=2)return ps[st-2];
  return ps[0]||"another place";
}
function locWarn(o,kind){
  if(!o||!hasLoc(o))return "";
  const note=o.geoNote||"";if(/^(Set by hand|Saved spot)/.test(note))return "";
  const full=o.geoLabel||"",label=full||(note.split("Found:")[1]||"").trim();
  const approx=/^Approx/.test(note);const out=[];
  const {town,zip}=typedTown(o.address||o.place||"");
  if(town&&label){
    const L=label.toLowerCase();
    const hit=L.includes(town.toLowerCase())||(zip&&L.includes(zip));
    const legacyExact=!full&&!approx&&/^\d/.test(label);   // old notes were cut short; a house-number match was exact
    if(!hit&&!legacyExact)out.push(approx?`Only found the town of ${labelPlace(label)}, not ${town}`:`Map put this in ${labelPlace(label)}, not ${town}`);
  }
  if(approx&&!out.length)out.push(/^Approx\. road/.test(note)?"Found the road, but not the house number":/^Approx\. ZIP/.test(note)?"Only matched the ZIP code area, not the street":"Only matched the town center, not the street");
  const others=roster.workers.filter(w=>w!==o&&w.active!==false&&hasLoc(w));
  if(others.length>=3){const near=Math.min(...others.map(w=>hav(o,w)));if(near>FAR_MI)out.push(`${Math.round(near)} mi from the nearest ${kind==="job"?"worker's home":"other worker"}`)}
  return out.join(" · ");
}
const LOC_FIX="Check it in Google Maps: right-click the spot (long-press on a phone), copy the numbers and paste them into Location.";
let formGeo=null;   // last "Find from address" result in the open form, so saving keeps its match details
function hav(a,b){
  const R=3958.8,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const hasLoc=o=>o&&typeof o.lat==="number"&&typeof o.lng==="number";
const miles=(w,j)=>hav(w,j)*S().roadFactor;
const fmtMi=m=>m<10?m.toFixed(1):Math.round(m)+"";

/* ---------- import parsers ---------- */
function stripHtml(s){const d=document.createElement("div");d.innerHTML=String(s||"").replace(/<br\s*\/?>/gi,"\n");return (d.textContent||"").trim()}
function parseKML(text){
  const doc=new DOMParser().parseFromString(text,"text/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("That file isn't valid KML.");
  const out=[];
  const pms=doc.getElementsByTagNameNS("*","Placemark");
  for(const pm of pms){
    const g=t=>{const e=pm.getElementsByTagNameNS("*",t)[0];return e?e.textContent.trim():""};
    const name=g("name")||"Unnamed";
    const coordsTxt=(pm.getElementsByTagNameNS("*","coordinates")[0]||{}).textContent||"";
    const pts=coordsTxt.trim().split(/\s+/).map(s=>s.split(",").map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1]));
    let lat=null,lng=null;
    if(pts.length){lng=pts.reduce((s,p)=>s+p[0],0)/pts.length;lat=pts.reduce((s,p)=>s+p[1],0)/pts.length}
    const extra={};
    for(const d of pm.getElementsByTagNameNS("*","Data")){
      const k=d.getAttribute("name");const v=(d.getElementsByTagNameNS("*","value")[0]||{}).textContent;
      if(k&&v!=null&&String(v).trim())extra[k]=String(v).trim();

/* ---------- address lookup (OpenStreetMap) ---------- */
let geoBusy=false;
/* ---------- address lookup ----------
   1. Saved spots: a location fixed by hand is remembered for that street address and reused (crew_places).
   2. The address is cleaned up first: "1891-1801 NC-24" → "1891 NC Highway 24", units and counties dropped.
   3. Each try asks several free services (Nominatim, OpenRouteService if a key is set, US Census, Photon) for a
      few results and keeps the one in the typed town or ZIP and near the crew — never a match far away when a
      closer one exists. Last resort is the ZIP area, then the town center. */
const geoCache=lsGet("crew_geo")||{};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const places=lsGet("crew_places")||{};   // normalized street address → {lat,lng,name,at}
const placeKey=a=>{const k=String(a||"").toLowerCase().replace(/,?\s*(usa|united states( of america)?)\s*$/,"").replace(/[^a-z0-9]+/g," ").trim();return /\d/.test(k)&&k.split(" ").length>=3?k:""};

function placeSave(addr,lat,lng,name){const k=placeKey(addr);if(!k||!isFinite(lat)||!isFinite(lng))return false;places[k]={lat:+lat,lng:+lng,name:String(name||"").slice(0,80),at:new Date().toISOString()};lsSet("crew_places",places);return true}
function placeForget(addr){const k=placeKey(addr);if(k&&places[k]){delete places[k];lsSet("crew_places",places)}}
function cleanAddr(a){
  return String(a||"").replace(/\s+/g," ")
    .replace(/,?\s*(USA|United States( of America)?)\s*$/i,"")
    .replace(/^(\d+)\s*[-–]\s*\d+\b/,"$1")                          // 1891-1801 NC-24 → 1891 NC-24
    .replace(/\b(?:apt|apartment|suite|ste|unit|lot|#)\s*[\w-]+/ig,"")
    .replace(/\s+,/g,",").replace(/,\s*,/g,",").trim();
}
const HWY_RE=/\b(NC|SC|US|I|SR|Hwy|Highway|State Road|State Hwy)[\s-]*(\d{1,4}[A-Z]?)\b(?:\s+(Hwy|Highway))?/i;

  const m=a.match(HWY_RE);if(!m)return [];
  const n=m[2],t=m[1].toUpperCase(),out=[];
  if(t==="NC"||t==="SR"||t.startsWith("STATE"))out.push(`NC Highway ${n}`,`NC ${n}`,`Highway ${n}`);
  else if(t==="US")out.push(`US Highway ${n}`,`US ${n}`);

  add(raw,"street");add(a,"street");add(noCounty,"street");
  hwyVariants(noCounty).forEach(v=>add(v,"street"));
  const street=/^\d/.test(noCounty);
  if(street){const nn=noCounty.replace(/^\d+\s+/,"");add(nn,"road");hwyVariants(nn).forEach(v=>add(v,"road"))}
  const {town,zip}=typedTown(noCounty);

  if(zip)add(`${zip}${town?"":", "+st.toUpperCase()}`,"zip");

/* All results for one search text, from every service that answers (cached). */
async function geoAll(q,good){

/* Does a result fit what was typed? In the typed town or ZIP, and not far from everyone. */
function geoFit(r,town,zip,kind){
  const L=norm(r.label);
  const inPlace=(!town&&!zip)||(town&&L.includes(norm(town)))||(zip&&(r.zip===zip||L.includes(zip)));
  const ws=roster.workers.filter(w=>w.active!==false&&hasLoc(w));
  const near=ws.length>=3?Math.min(...ws.map(w=>hav(r,w))):0;
  return {ok:inPlace&&near<=FAR_MI,score:(inPlace?100:0)+(near<=FAR_MI?50:0)+(r.num&&kind==="street"?20:0)-Math.min(near,500)/10};
}
async function geocodeAddress(addr){
  const saved=placeGet(addr);

  const cands=geoCandidates(addr);if(!cands.length)return null;

    const rs=await geoAll(c.q,r=>geoFit(r,town,zip,c.kind).ok);if(!rs.length)continue;
    const scored=rs.map(r=>({r,f:geoFit(r,town,zip,c.kind)})).sort((a,b)=>b.f.score-a.f.score);
    const best=scored[0];
    if(best.f.ok)return {...best.r,q:c.q,kind:c.kind,exact:c.kind==="street"&&(best.r.num||!hasStreet)};
    if(!fallback||best.f.score>fallback.f.score)fallback={...best,c};

/* ---------- solver ---------- */
/* Each job needs `trucks` trucks. Every truck needs exactly one crew lead (they have the company truck)
   plus (perTruck-1) workers. Spare leads may fill worker spots if the setting allows, but their truck sits idle. */

    const gs=Object.keys(RG);if(gs.length>150)gs.slice(0,gs.length-150).forEach(k=>delete RG[k]);
    localStorage.setItem("crew_rc",JSON.stringify(RC));localStorage.setItem("crew_rg",JSON.stringify(RG));
  }catch(e){try{for(const k in RG)delete RG[k];localStorage.setItem("crew_rg","{}");localStorage.setItem("crew_rc",JSON.stringify(RC))}catch(e2){}}
}
function travel(a,b){
  if(!hasLoc(a)||!hasLoc(b))return {min:1e5,mi:1e5,real:false};
  const ka=pk(a),kb=pk(b);if(ka===kb)return {min:0,mi:0,real:true};
  const v=RC[ka+">"+kb];if(v)return {min:v[0],mi:v[1],real:true};

const wById=id=>roster.workers.find(w=>w.id===id);
const jById=id=>tonight.jobs.find(j=>j.id===id);
const pairKey=(a,b)=>a<b?a+"|"+b:b+"|"+a;
function conflictSet(){return new Set(roster.conflicts.map(([a,b])=>pairKey(a,b)))}
/* Split a job's people into trucks: each truck gets one lead; each worker meets at the nearest lead's home. */
const legMiles=(a,b)=>hav(a,b)*S().roadFactor;
const routeMiles=(w,l,j)=>{const a=travel(l,w),b=travel(w,j),c=travel(l,j);return Math.max(0,(a.mi+b.mi-c.mi)/2)};
const pairMin=(w,l,j)=>{const a=travel(l,w),b=travel(w,j),c=travel(l,j);return Math.max(0,(a.min+b.min-c.min)/2)};
function routeGeom(L,j){return RG[pk(L)+">"+pk(j)]||null}
/* Nearest point on the lead's route (the real road route when we have it, else a straight line). */
function meetPoint(w,L,j){
  const g=routeGeom(L,j);

    let best=null;const n=g.pts.length;
    for(let i=0;i<n-1;i++){const A={lat:g.pts[i][0],lng:g.pts[i][1]},B={lat:g.pts[i+1][0],lng:g.pts[i+1][1]};const rp=routePoint(w,A,B);if(!best||rp.d<best.d)best={d:rp.d,lat:+rp.lat.toFixed(5),lng:+rp.lng.toFixed(5),t:(i+rp.t)/(n-1)}}

function trucksFor(j,crew){

  const dJob=w=>hasLoc(w)?travel(w,j).min:1e9;
  const dPair=(h,l)=>hasLoc(h)&&hasLoc(l)?pairMin(h,l,j):1e9;
  const forced=w=>isDriver(w.id,j.id);
  const leadPen=w=>{const L=leadLimit(w);return L&&hasLoc(w)&&travel(w,j).mi>L&&tonight.locks[w.id]!==j.id?1e6:0};
  const split=Tn=>{
    const {truckLeads,extra,hs,of}=pairCrew(people.filter(w=>w.lead),people.filter(w=>!w.lead),Tn,P,dJob,dPair,forced,leadPen);
    const trucks=[];for(let i=0;i<Tn;i++)trucks.push({lead:truckLeads[i]||null,crew:[]});
    const loose=[];
    for(const h of hs){if(of.has(h))trucks[of.get(h)].crew.push(h);else loose.push(h)}
    for(const h of loose){let t=trucks.find(t=>!t.lead&&t.crew.length<P-1)||trucks.find(t=>!t.lead)||trucks.reduce((a,b)=>a.crew.length<=b.crew.length?a:b);t.crew.push(h)}

  };

  if(!S().extraTruck||!base.spareLeads.length||base.trucks.some(t=>!t.lead))return base;
  const alt=split(T+1);
  if(alt.trucks.some(t=>!t.lead||!hasLoc(t.lead)))return base;
  if(alt.trucks.some(t=>leadPen(t.lead)>0))return base;   // an extra truck never sends a lead past their mile limit
  const crewMin=r=>{let m=0;for(const t of r.trucks){m+=dJob(t.lead);for(const w of t.crew){const g=legFor(j,w,t);m+=g?(g.kind==="pickup"?(g.addMin||0):g.min):0}}return m};
  const saved=crewMin(base)-crewMin(alt);

const EXTRA_TRUCK_MIN=10;
const truckLabel=(t,k)=>`Truck ${k+1}${t.extra?" (extra)":""}`;
/* How one person gets to the job:
   lead  → drives home to job
   pickup→ lead swings by their home (they're on the way)
   meet  → they drive to a spot on the lead's route and leave their car
   job   → no lead yet (or the job is closer than any point on the route) */
function legFor(j,w,truck){
  if(!hasLoc(w))return null;
  const L=truck&&truck.lead;
  if(!L||!hasLoc(L)){const tv=travel(w,j);return {kind:"job",mi:tv.mi,min:tv.min,real:tv.real}}
  if(L===w){const tv=travel(L,j);return {kind:"lead",mi:tv.mi,min:tv.min,real:tv.real}}
  const lw=travel(L,w),wj=travel(w,j),lj=travel(L,j);
  const detMin=Math.max(0,lw.min+wj.min-lj.min),detMi=Math.max(0,lw.mi+wj.mi-lj.mi);
  const mp=meetPoint(w,L,j);
  if(detMin<=(+S().pickupMin||0))return {kind:"pickup",mi:0,min:0,addMin:detMin,to:L,point:{lat:+w.lat,lng:+w.lng},t:mp.t,real:lw.real&&wj.real&&lj.real};
  const m=meetFor(w.id,L.id,j.id);
  if(m){const tv=travel(w,m);return {kind:"meet",mi:tv.mi,min:tv.min,to:L,point:{lat:m.lat,lng:m.lng},t:meetPoint(m,L,j).t,real:tv.real,spot:m}}
  if(mp.t>=0.97)return {kind:"atjob",mi:wj.mi,min:wj.min,to:L,point:{lat:+j.lat,lng:+j.lng},t:1,real:wj.real};
  if(mp.t<=0.03){const tv=travel(w,L);return {kind:"atlead",mi:tv.mi,min:tv.min,to:L,point:{lat:+L.lat,lng:+L.lng},t:0,real:tv.real}}
  const pnt={lat:mp.lat,lng:mp.lng};const tv=travel(w,pnt);
  // if meeting the truck is barely shorter than driving to the job itself, just go to the job
  if(wj.min<=tv.min+5||travel(pnt,j).min<10)return {kind:"atjob",mi:wj.mi,min:wj.min,to:L,point:{lat:+j.lat,lng:+j.lng},t:1,real:wj.real};
  return {kind:"meet",mi:tv.mi,min:tv.min,to:L,point:pnt,t:mp.t,real:tv.real};
}

/* ---------- Temp agency (setting `tempAgency`, agencies in settings.agencies) ----------

   workers a job is short and suggests turning the setting on. On: open worker spots become "Temp worker"

const agencyList=()=>(S().agencies||[]).filter(a=>a&&(a.name||a.address||a.phone));
const tempsOn=()=>!!S().tempAgency&&agencyList().length>0;
const agName=a=>a&&a.name||"the temp agency";
function agencyFor(j){

const agLine=g=>g?`${agName(g.a)}${g.a.phone?" "+g.a.phone:""}${g.mi!=null?` (~${fmtMi(g.mi)} mi from the job)`:""}`:"the temp agency";
/* Open worker spots on a job, per truck (an extra truck's lead counts as a worker, like jobIssues). */
function openSpots(j,crew,tk){

  const helpers=tk.trucks.reduce((n,t)=>n+t.crew.length+(t.extra?1:0),0);
  let left=Math.max(0,jTrucks(j)*(P-1)-helpers);
  const per=tk.trucks.map(t=>{if(t.extra)return 0;const k=Math.min(left,Math.max(0,P-1-t.crew.length));left-=k;return k});

function shortList(){const asg=tonight.assign||{};return tonight.jobs.filter(j=>asg[j.id]).map(j=>({j,n:openSpots(j,asg[j.id]).total,ag:agencyFor(j)})).filter(x=>x.n>0)}
function jobIssues(j,crew){
  const iss=[];const cs=conflictSet();
  const offS=new Set(tonight.off);
  {const lw=locWarn(j,"job");if(lw)iss.push(["warn",`Job location looks off: ${lw} — drive times may be wrong`])}
  if(j.time&&parseClock(j.time)==null)iss.push(["warn",`Couldn't read the report time “${j.time}” — no leave-by times. Tap the job in step 1 and type it like 7:00a`]);
  for(const wid of (j.avoid||[])){if(crew.includes(wid))iss.push(["bad",`${wById(wid)?.name} should not be sent to this job`])}
  for(const wid of (j.requested||[])){const w=wById(wid);if(!w)continue;
    if(offS.has(wid)||w.active===false)iss.push(["bad",`${w.name} was requested but is off today`]);
    else if(!crew.includes(wid))iss.push(["warn",`${w.name} was requested for this job but is assigned elsewhere`]);}
  for(let a=0;a<crew.length;a++)for(let b=a+1;b<crew.length;b++)if(cs.has(pairKey(crew[a],crew[b])))iss.push(["bad",`${wById(crew[a])?.name} and ${wById(crew[b])?.name} can't work together`]);
  const T=jTrucks(j),P=jPer(j);
  const {trucks,spareLeads,saved}=trucksFor(j,crew);
  const xt=trucks.find(t=>t.extra);if(xt)iss.push(["good",saved>=EXTRA_TRUCK_MIN?`${xt.lead.name} brings an extra truck — saves the crew about ${fmtDur(saved)} of driving`:`${xt.lead.name} brings their truck as an extra — they were driving to the job on their own anyway`]);
  const noLead=trucks.filter(t=>!t.lead).length;
  if(noLead)iss.push(["bad",noLead===T?(T>1?`No crew leads — all ${T} trucks need one`:"No crew lead — this truck can't go out"):`${noLead} of ${T} trucks still need a crew lead`]);
  const helpers=trucks.reduce((n,t)=>n+t.crew.length+(t.extra?1:0),0),needH=T*(P-1);
  if(helpers<needH){const n=needH-helpers,pl=n>1?"s":"";
    if(tempsOn())iss.push(["warn",`Short ${n} worker${pl} — ${n} temp${pl} from ${agLine(agencyFor(j))}`]);
    else iss.push(["warn",`Needs ${n} more worker${pl}`]);}
  if(helpers>needH)iss.push(["warn",`${helpers-needH} more than needed`]);
  spareLeads.forEach(w=>iss.push(["warn",`${w.name} (lead) is riding as a worker — their truck stays parked`]));
  trucks.forEach(t=>{if(t.lead&&hasLoc(t.lead)){const L=leadLimit(t.lead),d=travel(t.lead,j).mi;if(L&&d>L)iss.push(["warn",`${t.lead.name} lives ~${fmtMi(d)} mi from this job — past their ${L}-mile limit`])}});

}

const AVOID=/walmart|food lion|harris teeter|lowe'?s|home depot|target|kroger|publix|aldi|lidl|ingles|piggly|dollar|cvs|walgreens|rite aid|mcdonald|burger|wendy|bojangles|hardee|chick|taco|subway|sonic|zaxby|waffle|cracker|gas|fuel|shell|exxon|\bbp\b|citgo|sunoco|marathon|speedway|sheetz|wawa|circle k|kangaroo|7-eleven|quik|\bmart\b|store|shop|mall|plaza|outlet|restaurant|hotel|motel|\binn\b|hospital|apartment|church|school|bank/i;

async function findSpots(pt,home,lead,job){

  }

}

function rMap(jobs){

  let s=`<details style="margin-top:10px"><summary class="small">Map view</summary><svg class="map" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Map of jobs and worker homes">`;
  jobs.forEach((j,i)=>{trucksFor(j,tonight.assign[j.id]||[]).trucks.forEach(t=>{
    if(t.lead&&hasLoc(t.lead)){const gg=routeGeom(t.lead,j);
      if(gg&&gg.pts.length>1)s+=`<polyline points="${gg.pts.map(p=>X({lat:p[0],lng:p[1]})+","+Y({lat:p[0],lng:p[1]})).join(" ")}" fill="none" stroke="${colorFor(i)}" stroke-width="2.5" opacity=".75"/>`;
      else s+=`<line x1="${X(t.lead)}" y1="${Y(t.lead)}" x2="${X(j)}" y2="${Y(j)}" stroke="${colorFor(i)}" stroke-width="2.5" opacity=".75"/>`;}
    t.crew.forEach(w=>{if(!hasLoc(w))return;const g=legFor(j,w,t);const m=t.lead&&meetFor(w.id,t.lead.id,j.id);const to=m||(g&&g.point)||j;
      s+=`<line x1="${X(w)}" y1="${Y(w)}" x2="${X(to)}" y2="${Y(to)}" stroke="${colorFor(i)}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>`;
      if(g&&g.kind!=="pickup")s+=`<circle cx="${X(to)}" cy="${Y(to)}" r="3.5" fill="${colorFor(i)}"><title>${esc(m?m.name:"Meet "+w.name)}</title></circle>`});
  })});

  jobs.forEach((j,i)=>{s+=`<rect x="${X(j)-7}" y="${Y(j)-7}" width="14" height="14" rx="3" fill="${colorFor(i)}"><title>${esc(j.name)}</title></rect><text x="${X(j)+10}" y="${Y(j)+4}" font-size="12" fill="var(--ink)">${esc(j.name.slice(0,22))}</text>`});
  s+=`</svg><div class="small muted">■ jobs &nbsp; ○ homes (grey = not assigned). Solid = lead's truck to job (the real road route once road times are on), dashed = worker to where they join (dot = meet spot).</div></details>`;

  <details class="hsec"><summary>🤖 AI assistant (optional)</summary><p class="small">With a Claude API key saved under <b>Settings → AI assistant</b>: <b>Read job notes with AI</b> pulls trucks, crew size, requested and “don't send” people and important notes out of messy calendar text. After building crews, <b>Review with AI</b> looks for problems and better swaps — type anything special for today (who has to leave early, who to keep off a job) and it takes that into account. Each suggestion has an <b>Apply</b> button; applied people are locked 🔒 so a rebuild keeps them. Worker names, the jobs (with job-site addresses and the calendar notes as written), drive times and rules are sent — never workers' home addresses or phone numbers.</p></details>

  <p class="small"> When a calendar title gives only a town, the job is placed at the town's center. The tool never pairs people marked “can't work together”, and leans toward pairs marked “work well together”. Anyone you lock 🔒 stays put when you rebuild.</p></details>`;
}

function scheduleText(){
  const jd=scheduleDay();
  const d=jd?new Date(...jd.split("-").map((n,i)=>i===1?n-1:+n)):new Date();
  let t=`Crews — ${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}\n`;
  tonight.jobs.forEach(j=>{const c=tonight.assign?.[j.id];if(!c)return;const T=jTrucks(j);
    t+=`\n${j.time?j.time+" · ":""}${j.name}${j.address?" — "+j.address:""}${T>1?` (${T} trucks)`:""}\n`;
    if(!c.length){t+="  (no one assigned)\n";return}
    const tkT=trucksFor(j,c),osT=tempsOn()?openSpots(j,c,tkT):null,agT=osT&&agencyFor(j),arT=tempArrive(j);
    // first names on the "who does what" lines; when two people on the job share a first name, add the last initial
    const pplJ=tkT.trucks.flatMap(t=>[t.lead,...t.crew]).filter(Boolean);
    const nick=w=>{const fn=first(w.name);if(!pplJ.some(o=>o!==w&&first(o.name).toLowerCase()===fn.toLowerCase()))return fn;
      const ps=String(w.name).replace(/\(.*?\)/g,"").trim().split(/\s+/);return ps.length>1?`${fn} ${ps[ps.length-1][0]}.`:w.name};
    tkT.trucks.forEach((tr,k,all)=>{
      const nT=osT?osT.per[k]||0:0;
      const ppl=[tr.lead?`${tr.lead.name} (lead)${tr.lead.phone?" "+tr.lead.phone:""}`:"NEEDS LEAD",...tr.crew.map(w=>w.name+(w.phone?" "+w.phone:"")),...(nT?[`${nT>1?nT+" temp workers":"Temp worker"} (${agName(agT.a)})`]:[])];
      const tempLine=nT?`    ${nT>1?"Temps":"Temp"}: ${arT!=null?"be at the job by "+fmtClock(arT)+" — ":""}meet the crew at the job\n`:"";
      t+=`  ${all.length>1?`${truckLabel(tr,k)}: `:"• "}${ppl.join(", ")}\n`;
      if(!tr.lead){t+=tempLine;return}
      const pl=planTruck(j,tr);const gl=legFor(j,tr.lead,tr);const A=pl&&!pl.real?"about ":"";
      if(pl&&pl.leave!=null)t+=`    ${nick(tr.lead)}: leave ${fmtClock(pl.leave)} → on site ${A}${fmtClock(pl.arrive)}${gl?` (${fmtDur(gl.min)} drive)`:""}\n`;
      tr.crew.forEach(w=>{const g=legFor(j,w,tr);if(!g)return;const pp=pl&&pl.people[w.id]||{};
        let how;
        if(g.kind==="pickup")how=`${pp.ready!=null?"be ready "+fmtClock(pp.ready)+" — ":""}${nick(tr.lead)} picks up at home${w.address?" ("+w.address+")":""}`;
        else if(g.kind==="atjob")how=`${pp.leave!=null?"leave "+fmtClock(pp.leave)+" — ":""}meet the crew at the job`;
        else if(g.kind==="atlead")how=`${pp.leave!=null?"leave "+fmtClock(pp.leave)+" — ":""}meet at ${nick(tr.lead)}'s${tr.lead.address?": "+tr.lead.address:""}`;
        else if(g.spot)how=`${pp.leave!=null?"leave "+fmtClock(pp.leave)+" — ":""}meet ${nick(tr.lead)} ${pp.meet!=null?"at "+fmtClock(pp.meet)+" ":""}at ${g.spot.name}${g.spot.store?" (store lot — park away from the doors)":""} ${gmap(g.spot.lat,g.spot.lng)}`;
        else how=`${pp.leave!=null?"leave "+fmtClock(pp.leave)+" — ":""}meet ${nick(tr.lead)} ${pp.meet!=null?"at "+fmtClock(pp.meet)+" ":""}along the way (${fmtDur(g.min)} from home) near ${gmap(g.point.lat,g.point.lng)} — call to confirm the spot`;
        t+=`    ${nick(w)}: ${how}\n`;
      });
      t+=tempLine;
    });
  });
  const shT=shortList();
  if(shT.length){
    if(tempsOn()){t+=`\nTEMP WORKERS NEEDED — ${shT.reduce((a,x)=>a+x.n,0)} total:\n`;
      const by=new Map();shT.forEach(x=>{const k=x.ag.a.id;if(!by.has(k))by.set(k,{a:x.ag.a,rows:[]});by.get(k).rows.push(`    ${x.n} for ${x.j.time?x.j.time+" · ":""}${x.j.name}${x.j.address?" — "+x.j.address:""}`)});
      by.forEach(g=>{t+=`  ${agName(g.a)}${g.a.phone?" "+g.a.phone:""}${g.a.address?" ("+g.a.address+")":""}\n${g.rows.join("\n")}\n`});}
    else t+=`\n⚠ SHORT-HANDED — workers still needed:\n`+shT.map(x=>`  ${x.j.time?x.j.time+" · ":""}${x.j.name}: ${x.n} more worker${x.n>1?"s":""}\n`).join("");
  }
  const sk=skippedJobs();
  if(sk.length)t+=`\n⚠ NOT SCHEDULED YET — no crew assigned:\n`+sk.map(x=>`  ${x.j.time?x.j.time+" · ":""}${x.j.name}${x.j.address?" — "+x.j.address:""} (${hasLoc(x.j)?"added late":"no map location"})\n`).join("");
  return t;
}
function scheduleCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  let rows=[["Time","Job","Job address","Truck","Role","Worker","Phone","How they get there","Leave by","Pickup/meet time","Meet spot","Meet spot map","Drive (min)","Drive (mi)","Estimated"]];
  const how={lead:"Drives truck home to job",pickup:"Lead picks up at home",meet:"Meets truck along the way",atlead:"Meets at lead's home",atjob:"Meets at job",job:"Drives to job"};
  tonight.jobs.forEach(j=>{const c=tonight.assign?.[j.id];if(!c)return;
    if(!c.length){rows.push([j.time||"",j.name,j.address,"","","","","","","","","","","",""]);return}
    const tkC=trucksFor(j,c),osC=tempsOn()?openSpots(j,c,tkC):null,agC=osC&&agencyFor(j),arC=tempArrive(j);
    tkC.trucks.forEach((tr,k)=>{
      const pl=planTruck(j,tr);
      if(tr.lead){const g=legFor(j,tr.lead,tr);rows.push([j.time||"",j.name,j.address,tr.extra?(k+1)+" (extra)":k+1,"Lead",tr.lead.name,tr.lead.phone||"",how.lead,pl&&pl.leave!=null?fmtClock(pl.leave):"","","","",g?Math.round(g.min):"",g?fmtMi(g.mi):"",g&&!g.real?"yes":""])}
      else rows.push([j.time||"",j.name,j.address,tr.extra?(k+1)+" (extra)":k+1,"Lead","(needs lead)","","","","","","","","",""]);
      tr.crew.forEach(w=>{const g=legFor(j,w,tr);const pp=pl&&pl.people[w.id]||{};const pt=g&&g.spot?g.spot:(g&&g.kind==="meet"?g.point:null);
        rows.push([j.time||"",j.name,j.address,tr.extra?(k+1)+" (extra)":k+1,"Worker",w.name,w.phone||"",g?how[g.kind]:"",pp.leave!=null?fmtClock(pp.leave):"",pp.ready!=null?fmtClock(pp.ready):pp.meet!=null?fmtClock(pp.meet):"",g&&g.spot?g.spot.name:"",pt?gmap(pt.lat,pt.lng):"",g&&g.kind!=="pickup"?Math.round(g.min):"",g&&g.kind!=="pickup"?fmtMi(g.mi):"",g&&!g.real?"yes":""])});
      for(let q=0;q<(osC?osC.per[k]||0:0);q++)rows.push([j.time||"",j.name,j.address,tr.extra?(k+1)+" (extra)":k+1,"Temp",`Temp worker (${agName(agC.a)})`,agC.a.phone||"","Meets at job","",arC!=null?fmtClock(arC):"","","","","",""]);
    });
  });
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Copied — paste it into a text or group chat")}catch(e){showText(t)}}
function showText(t){const bg=document.createElement("div");bg.className="modalbg";bg.innerHTML=`<div class="modal"><p style="margin-top:0">Select all and copy:</p><textarea style="min-height:240px">${esc(t)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="b p">Close</button></div></div>`;bg.querySelector("button").onclick=()=>bg.remove();document.body.appendChild(bg);bg.querySelector("textarea").select()}
// On a phone, backups go to the Share sheet (text it, email it, AirDrop it, or Save to Files) instead of a hidden downloads folder.
// Returns false only when the person closed the Share sheet without picking anything.
async function shareFile(name,data){
  try{
    if(!(window.matchMedia&&matchMedia("(pointer:coarse)").matches)||!navigator.canShare||!navigator.share)return null;
    const type=name.endsWith(".json")?"application/json":name.endsWith(".csv")?"text/csv":"text/plain";
    const f=new File([data],name,{type});
    if(!navigator.canShare({files:[f]}))return null;
    await navigator.share({files:[f],title:name});
    toast("Shared "+name);return true;
  }catch(e){if(e&&e.name==="AbortError"){toast("Backup not saved — the share was cancelled");return false}return null}
}
async function download(name,data,opt){
  if(opt&&opt.share){const r=await shareFile(name,data);if(r!==null)return r}
  let dl=null;
  if(window.claude&&window.claude.use){try{dl=await window.claude.use("downloads")}catch(e){}}
  if(dl){try{await dl.save({filename:name,data});toast("Saved "+name)}catch(e){if(e&&e.code!=="declined"){if(data instanceof Blob)toast("Couldn't save the file here: "+(e.message||e.code));else showText(data)}}return}
  try{
    const type=name.endsWith(".json")?"application/json":name.endsWith(".csv")?"text/csv":"text/plain";
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Saved "+name+" to your downloads");
  }catch(e){showText(data)}
}

const AI_MODELS=[["claude-sonnet-5-5","Claude Sonnet 5.5 — best results (recommended)"],["claude-haiku-5-5","Claude Haiku 5.5 — fastest, cheapest"]];

function aiSet(c){try{localStorage.setItem("crew_ai",JSON.stringify(c))}catch(e){}}
const aiReady=()=>!!aiCfg().key;
async function askClaude(system,user,maxTokens){
  const c=aiCfg();if(!c.key)throw new Error("Add your Claude API key in Settings → AI assistant first.");
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":c.key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:c.model||AI_MODELS[0][0],max_tokens:maxTokens||4000,system,messages:[{role:"user",content:user}]})});
  }catch(e){throw new Error("Couldn't reach Claude. Check the internet connection. (On the shared Claude page AI is blocked — use the website version.)")}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    const m=j&&j.error&&j.error.message||("HTTP "+r.status);
    logEvent("ai-error",`${r.status}: ${m}`);
    if(r.status===401)throw new Error("Claude didn't accept the API key. Check it in Settings → AI assistant.");
    if(r.status===429)throw new Error("Claude is busy or the account hit a limit. Try again in a minute.");
    if(r.status===400&&/credit|billing|balance/i.test(m))throw new Error("The Claude API account needs credit. Add some at console.anthropic.com.");
    throw new Error("Claude error: "+m);
  }
  const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  logEvent("ai",`ok ${c.model||AI_MODELS[0][0]}`,{in:j.usage&&j.usage.input_tokens,out:j.usage&&j.usage.output_tokens});
  return text;
}
function parseJSONLoose(t){
  t=String(t||"").replace(/```(?:json)?/gi,"");
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a)throw new Error("Claude's answer wasn't in the expected format. Try again.");
  return JSON.parse(t.slice(a,b+1));
}
/* Map a name Claude wrote back to a roster person */
function personByName(n){
  n=String(n||"").trim().toLowerCase();if(!n)return null;
  const ws=roster.workers;
  let m=ws.filter(w=>w.name.trim().toLowerCase()===n);if(m.length===1)return m[0];
  m=ws.filter(w=>w.name.toLowerCase().replace(/\(.*?\)/g,"").trim()===n);if(m.length===1)return m[0];
  const parts=n.split(/\s+/);
  m=ws.filter(w=>{const wp=w.name.toLowerCase().split(/\s+/);return parts.every(x=>wp.includes(x))});
  return m.length===1?m[0]:null;
}
function jobByRef(ref){
  ref=String(ref||"").trim();if(!ref)return null;
  return tonight.jobs.find(j=>j.id===ref)||tonight.jobs.find(j=>j.name.toLowerCase()===ref.toLowerCase())||null;
}
function rosterForAI(){
  const off=new Set(tonight.off);
  return roster.workers.filter(w=>w.active!==false).map(w=>`${w.name}${w.lead?" [crew lead]":""}${off.has(w.id)?" [off today]":""}${leadLimit(w)&&w.lead?` [max ${leadLimit(w)} mi to job]`:""}`).join("\n");
}

/* 1) Read calendar notes: trucks, people per truck, requested people, important notes */
async function aiReadNotes(){
  const jobs=tonight.jobs;if(!jobs.length)return;
  const sys=`You help a dispatcher who schedules field crews. Each job is a calendar event. Every truck has exactly one crew lead plus workers. Read each job's title and notes and pull out ONLY what is stated or clearly implied:
- trucks: number of trucks needed (null if not stated)
- perTruck: people per truck INCLUDING the lead (null if not stated). "3 man crew" means perTruck 3.
- requested: people from the roster the event asks for by name (use the roster spelling; [] if none)
- avoid: people from the roster the event says NOT to send ([] if none)
- note: one short line of anything else the dispatcher must know (time limits, equipment, site rules, "no new guys"), or "" if nothing.
Never guess numbers that aren't there. Reply with JSON only: {"jobs":[{"id":"...","trucks":null,"perTruck":null,"requested":[],"avoid":[],"note":""}]}`;
  const user=`ROSTER:\n${rosterForAI()}\n\nJOBS:\n${jobs.map(j=>JSON.stringify({id:j.id,title:j.title||j.name,notes:j.desc||"",time:j.time||""})).join("\n")}`;
  const out=parseJSONLoose(await askClaude(sys,user,4000));
  let changed=0;const unknown=new Set();
  for(const r of (out.jobs||[])){
    const j=jobByRef(r.id);if(!j)continue;let c=false;
    if(Number.isFinite(+r.trucks)&&+r.trucks>=1&&+r.trucks<=20&&r.trucks!==null&&+r.trucks!==jTrucks(j)){j.trucks=+r.trucks;c=true}
    if(Number.isFinite(+r.perTruck)&&+r.perTruck>=1&&+r.perTruck<=20&&r.perTruck!==null&&+r.perTruck!==jPer(j)){j.crew=+r.perTruck;c=true}
    const req=new Set(j.requested||[]);
    for(const n of (r.requested||[])){const w=personByName(n);if(w){if(!req.has(w.id)){req.add(w.id);c=true}}else unknown.add(n)}
    j.requested=[...req];
    const av=new Set(j.avoid||[]);
    for(const n of (r.avoid||[])){const w=personByName(n);if(w){if(!av.has(w.id)){av.add(w.id);c=true}}else unknown.add(n)}
    j.avoid=[...av];
    const note=String(r.note||"").trim().slice(0,240);
    if(note!==(j.aiNote||"")){j.aiNote=note;c=true}
    if(c)changed++;
  }
  tonight.aiNotesAt=new Date().toISOString();
  save("tonight");render();
  toast(`AI read ${jobs.length} job${jobs.length===1?"":"s"} · ${changed} updated${unknown.size?` · couldn't match: ${[...unknown].slice(0,3).join(", ")}`:""}`);
}

/* 2) Review the built crews, with optional instructions for today */
function crewsForAI(){
  const asg=tonight.assign||{};const used=new Set(Object.values(asg).flat());
  const lines=[];
  for(const j of tonight.jobs){if(!asg[j.id])continue;const c=asg[j.id];
    lines.push(`JOB ${j.id} | ${j.time||""} ${j.name} | ${j.address||""} | needs ${jTrucks(j)} truck(s) x ${jPer(j)} people${(j.requested||[]).length?` | requested: ${j.requested.map(id=>wById(id)?.name).join(", ")}`:""}${(j.avoid||[]).length?` | do not send: ${j.avoid.map(id=>wById(id)?.name).join(", ")}`:""}${j.aiNote?` | note: ${j.aiNote}`:""}`);
    trucksFor(j,c).trucks.forEach((t,k)=>{
      const pl=planTruck(j,t);
      lines.push(`  Truck ${k+1}: ${t.lead?`${t.lead.name} (lead, ${fmtDur(travel(t.lead,j).min)} home→job${pl&&pl.leave!=null?`, leaves ${fmtClock(pl.leave)}, on site ${fmtClock(pl.arrive)}`:""})`:"NO LEAD"}`);
      t.crew.forEach(w=>{const g=legFor(j,w,t);lines.push(`    - ${w.name}${w.lead?" (a lead riding as worker)":""}: ${g?{pickup:`picked up at home (adds ${fmtDur(g.addMin||0)} to the lead's drive)`,meet:`drives ${fmtDur(g.min)} to meet the truck`,atlead:`drives ${fmtDur(g.min)} to the lead's home`,atjob:`drives ${fmtDur(g.min)} to the job`,job:`drives ${fmtDur(g.min)} to the job`}[g.kind]:"no location"}${tonight.locks[w.id]===j.id?" [locked]":""}`)});
    });
    const iss=jobIssues(j,c).filter(x=>x[0]!=="good");if(iss.length)lines.push(`  Problems: ${iss.map(i=>i[1]).join("; ")}`);
  }
  const off=new Set(tonight.off);
  const free=roster.workers.filter(w=>w.active!==false&&!off.has(w.id)&&!used.has(w.id));
  if(free.length){
    lines.push("NOT ASSIGNED (available):");
    for(const w of free){
      let near=tonight.jobs.filter(j=>asg[j.id]&&hasLoc(j)&&hasLoc(w)).map(j=>({j,d:travel(w,j).min})).sort((a,b)=>a.d-b.d).slice(0,3);
      lines.push(`  - ${w.name}${w.lead?" (crew lead)":""}${hasLoc(w)?"":" (no home location)"}${near.length?` — nearest jobs: ${near.map(x=>`${x.j.name} ${fmtDur(x.d)}`).join(", ")}`:""}`);
    }
  }
  return lines.join("\n");
}
async function aiReview(instructions){
  const rules=[...roster.conflicts.map(([a,b])=>`${wById(a)?.name} and ${wById(b)?.name} can NOT work together`),...roster.prefers.map(([a,b])=>`${wById(a)?.name} and ${wById(b)?.name} work well together`)].filter(x=>!/undefined/.test(x));
  const sys=`You are reviewing tomorrow's crew assignments for a field-service dispatcher. Rules of the business:
- Every truck needs exactly one crew lead (they drive the company truck from their home to the job).
- Workers ride with a lead: the lead picks them up if they live on the way, otherwise they drive to meet the truck along the route.
- Never put two people who "can NOT work together" on the same job.
- Requested people should be on the job that requested them; "do not send" people must not be.
- Shorter drives are better, but a full crew with a lead matters more than distance.
- Respect any instructions the dispatcher gives for today.
Drive times are in minutes (road-based when available, otherwise estimates).
Review the assignment. Find real problems and clear improvements only (don't suggest changes that are just as good). Each suggestion must be concrete moves the app can apply.
Move format: {"person":"exact roster name","toJob":"JOB id"} to move/add someone to a job, or {"person":"name","toJob":"unassigned"} to take them off, or {"person":"name","off":true} to mark them off today.
Reply with JSON only:
{"summary":"2-3 plain sentences on how the day looks","suggestions":[{"title":"short","why":"one or two sentences","moves":[...]}],"questions":["anything the dispatcher should double-check"]}
Give at most 6 suggestions, most important first. If everything looks good, say so and return an empty suggestions list.`;
  const user=`${instructions?`DISPATCHER'S INSTRUCTIONS FOR TODAY:\n${instructions}\n\n`:""}CREW RULES:\n${rules.join("\n")||"(none)"}\n\nROSTER:\n${rosterForAI()}\n\nCURRENT CREWS:\n${crewsForAI()}`;
  const out=parseJSONLoose(await askClaude(sys,user,5000));
  tonight.aiReview={stale:false,at:new Date().toISOString(),instructions:instructions||"",summary:String(out.summary||"").slice(0,1200),
    suggestions:(out.suggestions||[]).slice(0,8).map(sg=>({title:String(sg.title||"Suggestion").slice(0,140),why:String(sg.why||"").slice(0,600),moves:(sg.moves||[]).slice(0,12),applied:false})),
    questions:(out.questions||[]).slice(0,5).map(q=>String(q).slice(0,300))};
  save("tonight");render();
}
function applySuggestion(i){
  const sg=tonight.aiReview&&tonight.aiReview.suggestions[i];if(!sg||!tonight.assign)return;
  const bad=[];
  for(const mv of sg.moves){
    const w=personByName(mv.person);if(!w){bad.push(mv.person);continue}
    const toNone=String(mv.toJob).toLowerCase()==="unassigned";
    const j=mv.off||toNone?null:jobByRef(mv.toJob);
    if(!mv.off&&!toNone&&(!j||!tonight.assign[j.id])){bad.push(mv.person);continue}   // the job is gone: leave the person where they are
    for(const k in tonight.assign)tonight.assign[k]=tonight.assign[k].filter(x=>x!==w.id);
    delete tonight.locks[w.id];
    if(mv.off){if(!tonight.off.includes(w.id))tonight.off.push(w.id);continue}
    if(toNone)continue;
    if(tonight.off.includes(w.id))tonight.off=tonight.off.filter(x=>x!==w.id);
    tonight.assign[j.id].push(w.id);tonight.locks[w.id]=j.id;
  }
  sg.applied=true;logEvent("ai-apply",sg.title);
  save("tonight");render();
  toast(bad.length?`Applied, but couldn't place: ${bad.join(", ")}`:"Applied — those people are locked 🔒 so a rebuild keeps them");
}

/* ---------- Type a job in plain English (optional, off by default) ----------
   The dispatcher types something like "Smith mowing 412 Oak St Raeford, 7am, 2 trucks of 3, req Marcus, no Kevin"
   and the Add a job form is filled in for them to check and Save. It only fills the form: nothing is saved
   without the Save button, and building crews / picking drivers still follows the normal rules.
   Readers, tried in this order with "Automatic": the browser's built-in AI (Chrome 148+ on a capable PC; free,
   stays on the device) → Google Gemini (free key) → Claude (the AI assistant key) → the basic reader (no AI,
   works offline). Only the typed sentence is sent; the roster is never sent — names are matched on the device.
   Settings + Gemini key live only in localStorage "crew_jobtext" (never in backups or support packs). */
const JT_ENGINES=[["auto","Automatic — free options first"],["builtin","Built-in browser AI (free, on this device)"],["gemini","Google Gemini (free key)"],["claude","Claude (uses the AI assistant key)"],["basic","Basic reader — no AI, works offline"]];

function jtCfg(){return lsGet("crew_jobtext")||{}}

const JT_SYS=`You turn a dispatcher's plain-English description of ONE field-service job into form fields. Every truck has one crew lead plus workers.
Return JSON only, with these keys:
- name: short job name, usually the client (and contact if given), e.g. "Smith" or "Lee Electric / Cameron Epps". No times, counts, days or addresses in it.
- time: report time like "7:00a" or "12:30p", or "" if not given.

const JT_SCHEMA={type:"object",properties:{name:{type:"string"},time:{type:"string"},address:{type:"string"},trucks:{type:["integer","null"]},perTruck:{type:["integer","null"]},requested:{type:"array",items:{type:"string"}},avoid:{type:"array",items:{type:"string"}},day:{type:"string"},note:{type:"string"}},required:["name","time","address","trucks","perTruck","requested","avoid","day","note"]};

/* Basic reader: no AI, works anywhere */
const JT_NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,a:1,an:1,single:1};

function jtBasic(text){

  if(m){const h=+m[1],ap=m[3]?m[3][0].toLowerCase():(h<=11?"a":"p");out.time=`${h}:${m[2]||"00"}${ap}`;t=t.replace(m[0]," ")}

  if(!tonight.assign){if(!quiet)toast("Build crews first");return}
  const date=scheduleDay();const now=new Date().toISOString();
  const jobs=snapshotJobs();if(!jobs.length){if(!quiet)toast("No crews to save");return}
  const prev=HIST.get(date);
  const rec=prev?JSON.parse(JSON.stringify(prev)):{date,createdAt:now,saves:0,changes:[],jobs:[]};
  const what=[];
  const prevByKey=new Map();{const seenP={};for(const j of (prev?prev.jobs:[])){let k=j.key;seenP[k]=(seenP[k]||0)+1;if(seenP[k]>1){k=k+"#"+seenP[k];j.key=k}prevByKey.set(k,j)}}   // older records could hold the same key twice
  const merged=jobs.map(nj=>{const pj=prevByKey.get(nj.key);
    if(pj){prevByKey.delete(nj.key);
      const a=new Set(histPeople(pj)),b=new Set(histPeople(nj));
      const add=[...b].filter(x=>!a.has(x)),rem=[...a].filter(x=>!b.has(x));
      if(add.length||rem.length)what.push(`${nj.name}: ${[...add.map(x=>"+"+x),...rem.map(x=>"−"+x)].join(", ")}`);
      return {...nj,note:pj.note||"",status:pj.status||null,closedAt:pj.closedAt||null,people:pj.people||[]};
    }
    if(prev)what.push(`Added ${nj.name}`);
    return nj;});
  for(const pj of prevByKey.values()){if(!pj.dropped)what.push(`${pj.name} no longer on the schedule`);merged.push({...pj,dropped:true})}
  rec.jobs=merged;rec.saves=(rec.saves||0)+1;rec.updatedAt=now;rec.appVersion=APP_VERSION;
  if(!prev)rec.changes.push({at:now,what:"Schedule saved"});
  else if(what.length)rec.changes.push({at:now,what:"Schedule resent — "+what.join("; ")});
  tonight.histSaved={date,sig:crewSig(jobs),at:now};save("tonight");
  await histPut(rec);
  logEvent("history",`saved ${date} (${jobs.length} jobs)`);
  render();
  if(!quiet)toast(prev?(what.length?"History updated with the changes":"History already up to date"):"Saved to History");
}
function histUnsaved(){
  if(!tonight.assign)return false;
  const sig=crewSig(snapshotJobs());
  return !tonight.histSaved||tonight.histSaved.sig!==sig||tonight.histSaved.date!==scheduleDay();
}
function openCloseouts(){
  const today=dayKey(new Date());const out=[];
  HIST.forEach(r=>{if(r.date<today){const n=r.jobs.filter(j=>!j.dropped&&!j.status).length;if(n)out.push({date:r.date,n})}});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
async function histEdit(date,fn,what){
  const r=HIST.get(date);if(!r)return;const c=JSON.parse(JSON.stringify(r));
  fn(c);c.updatedAt=new Date().toISOString();if(what)c.changes.push({at:c.updatedAt,what});
  await histPut(c);render();
}
const dLabel=(d,opt)=>{const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString([],opt||{weekday:"short",month:"short",day:"numeric",year:"numeric"})};
const tLabel=iso=>new Date(iso).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

/* --- PC file (Chrome/Edge) --- */
let fileHandle=null,fileState="none",fileLast=null; // none | ok | reconnect | unsupported
const fileSupported=()=>typeof window.showSaveFilePicker==="function"&&window.self===window.top;
async function fileInit(){
  if(!fileSupported()){fileState="unsupported";return}
  try{fileHandle=histMode==="idb"?await IDB.get("histFile"):null}catch(e){fileHandle=null}
  if(!fileHandle){fileState="none";return}
  try{const p=fileHandle.queryPermission?await fileHandle.queryPermission({mode:"readwrite"}):"prompt";fileState=p==="granted"?"ok":"reconnect"}catch(e){fileState="reconnect"}
}
function historyJSON(){return JSON.stringify({app:"crew-scheduler",kind:"history",version:1,exportedAt:new Date().toISOString(),appVersion:APP_VERSION,days:[...HIST.values()].sort((a,b)=>a.date.localeCompare(b.date))},null,1)}
let fileBusy=false,fileAgain=false;
async function fileSync(){
  if(!fileHandle||fileState!=="ok")return;
  if(fileBusy){fileAgain=true;return}
  fileBusy=true;
  try{const w=await fileHandle.createWritable();await w.write(historyJSON());await w.close();fileLast=new Date().toISOString()}
  catch(e){fileState="reconnect";logEvent("error","History file write failed: "+e.message);render()}
  fileBusy=false;if(fileAgain){fileAgain=false;fileSync()}
}
async function fileConnect(){
  try{
    const h=await window.showSaveFilePicker({suggestedName:"Crew History.json",types:[{description:"Crew history",accept:{"application/json":[".json"]}}]});
    fileHandle=h;fileState="ok";if(histMode==="idb"){try{await IDB.set("histFile",h)}catch(e){logEvent("history","couldn't remember file handle: "+e.message)}}
    // if the chosen file already has history (e.g. from another PC), merge it in first
    try{const t=await (await h.getFile()).text();if(t.trim()){const n=mergeHistory(JSON.parse(t).days||[]);if(n)toast(`Merged ${n} day(s) from the file`)}}catch(e){}
    await fileSync();logEvent("history","file connected");render();toast("History file connected — it updates automatically");
  }catch(e){if(e&&e.name!=="AbortError")toast("Couldn't connect the file: "+e.message)}
}
async function fileReconnect(){
  try{const p=await fileHandle.requestPermission({mode:"readwrite"});fileState=p==="granted"?"ok":"reconnect";if(fileState==="ok")await fileSync();render()}catch(e){toast("Couldn't reconnect: "+e.message)}
}
async function fileDisconnect(){fileHandle=null;fileState="none";if(histMode==="idb"){try{await IDB.set("histFile",null)}catch(e){}}render()}
/* merge days from a backup or history file: newer edits win, nothing is deleted */
function mergeHistory(days){
  let n=0;
  for(const d of (days||[])){
    if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!Array.isArray(d.jobs))continue;
    const cur=HIST.get(d.date);
    if(!cur||(d.updatedAt||"")>(cur.updatedAt||"")){HIST.set(d.date,d);n++;
      if(histMode==="idb")IDB.put(d).catch(()=>{});}
  }
  if(n&&histMode==="ls"){const o={};HIST.forEach((r,k)=>o[k]=r);lsSet("crew_history",o)}
  if(n)fileSync();
  return n;
}

function rHistSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return "";
  const rows=[];
  [...HIST.values()].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>r.jobs.forEach(j=>{
    const people=histPeople(j).concat((j.people||[]).map(p=>p.name));
    const hay=[j.name,j.client,j.contact,j.title,j.address,j.note,...people].join(" ").toLowerCase();
    if(terms.every(t=>hay.includes(t)))rows.push({r,j});
  }));
  if(!rows.length)return `<p class="small muted">No matches.</p>`;
  return `<p class="small muted">${rows.length} match${rows.length>1?"es":""}</p>`+rows.slice(0,150).map(({r,j})=>{
    const st=j.status?STATUS[j.status].icon+" "+STATUS[j.status].label:"Not closed out";
    return `<div class="item" style="margin-top:6px;cursor:pointer" data-act="histOpen" data-d="${r.date}"><div class="main"><div class="t">${esc(dLabel(r.date))} · ${j.time?esc(j.time)+" · ":""}${esc(j.name)}</div><div class="s">${esc(j.address||"")} · ${esc(st)}<br>${j.crews.map(t=>`${j.crews.length>1?"Truck "+t.truck+": ":""}${t.lead?esc(t.lead.name)+" (lead)":"no lead"}${t.workers.map(w=>", "+esc(w.name)).join("")}`).join(" · ")}</div></div></div>`}).join("");
}
function historyCSV(from,to){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Date","Day","Time","Client","Contact","Job","Location","Status","Truck","Role","Person","How they got there","Crew change","Job note"]];
  [...HIST.values()].filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const day=dLabel(r.date,{weekday:"short"});
    r.jobs.forEach(j=>{
      const st=j.dropped?"Not on final schedule":j.status?STATUS[j.status].label:"Not closed out";
      const chg=n=>(j.people||[]).filter(p=>p.name===n).map(p=>(CHANGE_KINDS[p.kind]||p.kind)+(p.note?": "+p.note:"")).join("; ");
      const base=[r.date,day,j.time,j.client,j.contact,j.name,j.address,st];
      j.crews.forEach(t=>{
        rows.push([...base,t.truck,"Lead",t.lead?t.lead.name:"(no lead)","Drove truck",t.lead?chg(t.lead.name):"",j.note]);
        t.workers.forEach(w=>rows.push([...base,t.truck,"Worker",w.name,w.how,chg(w.name),j.note]));
      });
      const inCrew=new Set(histPeople(j));
      (j.people||[]).filter(p=>!inCrew.has(p.name)).forEach(p=>rows.push([...base,"","Worker",p.name,"",(CHANGE_KINDS[p.kind]||p.kind)+(p.note?": "+p.note:""),j.note]));
    });
  });
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
