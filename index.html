<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Scheduler</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16191d;--muted:#5f6b78;--line:#e2e6eb;
  --accent:#1f6feb;--accent-ink:#fff;--warn:#b45309;--warn-bg:#fff7e6;--bad:#c62828;--bad-bg:#fdecec;--ok:#15803d;--ok-bg:#e9f7ee;
  --chip:#eef1f5;--radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--muted:#9aa5b1;--line:#2a3038;--accent:#4c8dff;--chip:#232932;
  --warn:#f5b454;--warn-bg:#2d2414;--bad:#ff7b7b;--bad-bg:#2e1717;--ok:#5fd08a;--ok-bg:#132619;}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0}
.ver{font:inherit;font-size:11px;font-weight:500;color:var(--accent);margin-left:4px;white-space:nowrap;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer;vertical-align:2px}
.ver.new::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 4px;font:inherit;font-size:12px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cal .d.empty{background:transparent;border-color:transparent;cursor:default}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal .dots{display:flex;flex-wrap:wrap;gap:2px}
.cal .dot{width:7px;height:7px;border-radius:50%}
.st-done{background:#16a34a}.st-rain{background:#2563eb}.st-cancel{background:#9ca3af}.st-open{background:#f59e0b}
.stbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.stbtn.on.done{background:#16a34a;color:#fff;border-color:#16a34a}.stbtn.on.rain{background:#2563eb;color:#fff;border-color:#2563eb}.stbtn.on.cancel{background:#6b7280;color:#fff;border-color:#6b7280}
.rel h3{margin:14px 0 2px;font-size:15px}.rel ul{margin:4px 0 0;padding-left:20px}.rel li{margin:3px 0;font-size:14px}
.rel .lbl{font-size:12px;font-weight:700;margin-top:6px}
#saveState{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 8px;max-width:980px;margin:0 auto;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer}
@media (max-width:480px){nav{padding:0 2px;gap:0}nav button{padding:10px 7px;font-size:14px}}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:12px 0 6px}
.step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center;margin-right:6px;vertical-align:1px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
label.row.small{flex-wrap:nowrap;align-items:flex-start;gap:8px}
label.row.small input[type=checkbox]{margin-top:2px;flex:none;width:18px;height:18px}
button.b,label.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}
button.b:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=tel],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{width:72px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.off{background:transparent;color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.lead{background:var(--ok-bg);color:var(--ok)}
.tag.lock{background:var(--chip);color:var(--accent)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.bad{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.good{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.job{border:1px solid var(--line);border-left:5px solid var(--c,#888);border-radius:10px;padding:10px;background:var(--bg)}
.job .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job .nm{font-weight:700;overflow-wrap:anywhere}
.mem{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.mem:first-of-type{border-top:0}
.mem .n{flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{font-size:18px;display:block}
.stat span{font-size:12px;color:var(--muted)}
svg.map{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px}
details summary{cursor:pointer;font-weight:600}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:30;max-width:90vw}
.hide{display:none!important}
ol.help li{margin-bottom:8px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Crew Scheduler <button id="appVer" class="ver" data-act="whatsNew" title="What's new"></button></h1><span id="saveState">Loading…</span></div>
  <nav id="tabs">
    <button data-tab="tonight" class="on">Today</button>
    <button data-tab="workers">Workers</button>
    <button data-tab="rules">Crew rules</button>
    <button data-tab="history">History<span id="histDot" class="hide" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:2px"></span></button>
    <button data-tab="help">How to</button>
  </nav>
</header>
<main id="app"></main>
<input type="file" id="fileJobs" accept=".kml,.kmz,.csv,.ics,.txt,application/vnd.google-earth.kml+xml" class="hide">
<input type="file" id="fileWorkers" accept=".kml,.kmz,.csv,.txt,.json,application/json" class="hide">

<script>
"use strict";
/* ---------- state ---------- */
const APP_VERSION="2026.11.09-i";
/* Release notes — newest first. Add an entry here with every update. */
const CHANGELOG=[
 {v:"2026.11.09-i",date:"Nov 9, 2026",added:["Smarter address lookup: messy addresses are cleaned up first (like “1891-1801 NC-24” → “1891 NC Highway 24”), more free map services are asked (US Census, and OpenRouteService if your routing key is set), and the result in the town or ZIP you typed is picked — not one far away.","If the house can't be found, it falls back to the road, then the ZIP code area, before the town center.","Fixed spots are remembered: when you paste the right location for an address, every later job or worker with that address uses it automatically. Saved spots are included in backups.","“Look up again” button for jobs and workers marked in orange."]},
 {v:"2026.11.09-h",date:"Nov 9, 2026",added:["Warning when a typed address lands in the wrong place: the map found a different town than the one you typed, only the town center (not the street), or a spot far from all your workers.","Jobs and workers with a location that looks off are marked in orange, listed at the top of the Today tab, and flagged on the crews, with how to paste the exact spot from Google Maps."]},
 {v:"2026.11.09-g",date:"Nov 9, 2026",fixed:["Opening a backup file with Workers → Import list now restores it properly. Before, it turned every line of the backup into a fake “worker” (like “{” or “name: …”) and the real people didn't come in.","Restoring a backup also clears out those fake rows if an earlier import left them behind.","Opening a backup file in the Today tab now says to use Restore backup instead of making junk jobs."]},
 {v:"2026.11.09-f",date:"Nov 9, 2026",fixed:["A worker whose meet point would be basically at the job site (or barely closer than the job) is now told to drive straight to the job instead."]},
 {v:"2026.11.09-e",date:"Nov 9, 2026",added:["Pickups are now decided by time: a lead picks a worker up at home if it adds no more than 10 minutes to the drive (adjustable); otherwise the worker meets the truck along the way.","Real road drive times (free OpenRouteService key, set in Crew rules): matching, pickups and meet points now follow actual roads and minutes, not straight lines.","Leave-by times for everyone: when each lead leaves home, when each pickup should be ready, and when each worker leaves to meet the truck.","Arrive-early buffer (15 min) and minutes per pickup or meet stop (5 min) — both adjustable in Crew rules.","Without a routing key, times are estimated (shown with ≈) at an adjustable average speed."]},
 {v:"2026.11.09-d",date:"Nov 9, 2026",added:["New History tab: every day's schedule is saved when you copy or send it — who was on each truck, for which job.","Close out each job the next morning: Completed, Rained out or Cancelled, with a note and crew changes (sent home, no-show, swapped in).","Month calendar with colored dots, a search box (person, client or town) and spreadsheet export for any date range.","On a PC (Chrome or Edge): connect a history file once and it's kept up to date automatically.","History is included in backups and kept forever."]},
 {v:"2026.11.09-c",date:"Nov 9, 2026",added:["“Download this app” button (How to tab and Crew rules) on the website version: saves a copy you can open on a computer without internet setup, named with its version number."]},
 {v:"2026.11.09-b",date:"Nov 9, 2026",added:["What's new: tap the version number at the top to see what changed. It also pops up once after each update."]},
 {v:"2026.11.09-a",date:"Nov 9, 2026",added:["Version number shown in the top bar on every screen.","Separate delete choices in Crew rules → Delete data: today's crews, today's jobs & crews, all workers & crew rules, or everything.","“Delete all workers…” on the Workers tab, with a “Save backup first” option."]},
 {v:"2026.11.08-ai1",date:"Nov 8, 2026",added:["AI assistant (optional, needs a Claude API key): “Read job notes with AI” pulls trucks, crew size, requested and “don't send” people and key notes from calendar text.","“Review with AI” checks the built crews, takes today's special instructions, and suggests fixes you can apply with one tap.","“Don't send” list per job — those people are never put on that job."],fixed:["Calendar notes are now kept in full (up to 1,500 characters) so nothing important is cut off."]},
 {v:"2026.11.07-g",date:"Nov 7, 2026",added:["Max distance from a crew lead's home to the job, with an optional limit per lead.","“Pack & save for support”: one .zip with everything needed to troubleshoot a problem.","A log of recent errors and actions, included in support packs."],fixed:["Checkbox labels no longer wrap onto their own line on phones."]},
 {v:"2026.11.07-c",date:"Nov 7, 2026",added:["Requested crew: people named in a calendar event (e.g. “Req: Marcus, Lena”) are put on that job automatically. You can also pick them by hand.","Option to include store & gas station lots (Walmart, Food Lion…) as meet spots, marked with a towing warning."]},
 {v:"2026.11.07-b",date:"Nov 7, 2026",added:["Workers are picked up at home if they live on the lead's way to the job, or meet the truck along the route.","Workers are matched to the lead whose route passes closest to them.","Optional meet spots: finds Park & Ride lots and public parking near the route.","Schedule shows each worker's pickup or meet spot with a map link."]},
 {v:"2026.11.07-a",date:"Nov 7, 2026",added:["Backup & restore of all workers, leads and crew rules — move them to another phone or a newer version.","Merge or replace when restoring.","Export workers as a spreadsheet (CSV)."],fixed:["Saving files now works in the downloaded/website version (it used to only show text to copy)."]},
 {v:"2026.11.06",date:"Nov 6, 2026",added:["Every truck gets exactly one crew lead (they have the company truck), then workers.","Jobs can need several trucks; set Trucks and People per truck on each job.","Truck counts like “2 trucks” or “3 man crew” are read from the calendar.","“Tonight” renamed to “Today”; calendar import picks today's jobs by default."]},
 {v:"2026.11.03-b",date:"Nov 3, 2026",added:["Import jobs from the Google Calendar export (.ics or .zip), choosing the day.","Reads titles like “7a-Lee Electric/Cameron Epps-Raeford, NC” into time, job and town; skips headings like “***Fayetteville Schedule***”.","Finds job towns and worker home addresses on the map automatically."]},
 {v:"2026.11.03",date:"Nov 3, 2026",added:["First version: workers with home locations, “can't work together” and “work well together” rules, build crews by distance, copy or download the schedule."]},
];

/* Small rolling log of errors and key actions, kept on this device for support packs. */
const LOG=(()=>{try{return JSON.parse(localStorage.getItem("crew_log"))||[]}catch(e){return []}})();
function logEvent(type,msg,extra){
  try{LOG.push({t:new Date().toISOString(),type,msg:String(msg).slice(0,500),...(extra?{extra}:{})});while(LOG.length>300)LOG.shift();localStorage.setItem("crew_log",JSON.stringify(LOG))}catch(e){}
}
window.addEventListener("error",e=>logEvent("error",e.message,{src:(e.filename||"").split("/").pop(),line:e.lineno,col:e.colno,stack:e.error&&e.error.stack?String(e.error.stack).slice(0,800):""}));
window.addEventListener("unhandledrejection",e=>logEvent("error","Unhandled: "+(e.reason&&e.reason.message||e.reason),{stack:e.reason&&e.reason.stack?String(e.reason.stack).slice(0,800):""}));
logEvent("open","App opened",{version:APP_VERSION});
const DEFAULT_SETTINGS={defaultCrew:2,maxMiles:0,maxLeadMiles:0,roadFactor:1.25,leadsAsHelpers:true,pickupMiles:2,pickupMin:10,allowStores:false,arriveEarly:15,stopMinutes:5,avgMph:40};
/* A lead's own limit (set on the lead) wins over the default. 0 = no limit. */
const leadLimit=w=>{const own=+(w&&w.maxMiles)||0;return own>0?own:(+S().maxLeadMiles||0)};
let roster={workers:[],conflicts:[],prefers:[],settings:{...DEFAULT_SETTINGS}};
let tonight={jobs:[],assign:null,locks:{},off:[],importedAt:null,source:""};
let tab="tonight";
let editingWorker=null; // id or "new"
let editingJob=null;
const PALETTE=["#1f77b4","#d62728","#2ca02c","#9467bd","#ff7f0e","#17becf","#8c564b","#e377c2","#7f7f7f","#bcbd22","#3366cc","#dc3912","#109618","#990099","#0099c6","#dd4477"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const S=()=>roster.settings;

/* ---------- persistence ---------- */
let db=null, dbOK=false;
const saveTimers={}, lastWritten={}, writing={};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function setSave(t){$("#saveState").textContent=t}
function normalize(){
  roster.workers=roster.workers||[];roster.conflicts=roster.conflicts||[];roster.prefers=roster.prefers||[];
  if(roster.settings&&roster.settings.maxLeadMiles===undefined)roster.settings.maxLeadMiles=roster.settings.maxMiles||0;
  roster.settings={...DEFAULT_SETTINGS,...(roster.settings||{})};
  delete roster.settings.requireLead;
  tonight.jobs=tonight.jobs||[];tonight.jobs.forEach(j=>{if(!j.trucks)j.trucks=1});tonight.locks=tonight.locks||{};tonight.off=tonight.off||[];
}
function save(which){
  const obj=which==="roster"?roster:tonight;
  lsSet("crew_"+which,obj);
  if(!dbOK){setSave("Saved on this device");return}
  clearTimeout(saveTimers[which]);
  setSave("Saving…");
  saveTimers[which]=setTimeout(()=>flush(which),700);
}
async function flush(which){
  if(writing[which]){saveTimers[which]=setTimeout(()=>flush(which),400);return}
  saveTimers[which]=null;
  const obj=which==="roster"?roster:tonight;
  const json=JSON.stringify(obj);
  if(json===lastWritten[which]){setSave("All changes saved");return}
  writing[which]=true;
  try{
    await db.doc("app/"+which).set(JSON.parse(json));
    lastWritten[which]=json;setSave("All changes saved");
  }catch(e){
    if(e&&e.code==="unavailable"){writing[which]=false;setTimeout(()=>flush(which),1500+Math.random()*1000);return}
    if(e&&e.code==="quota_exceeded")setSave("Storage full — remove old data");
    else setSave("Can't save to account (saved on this device)");
  }
  writing[which]=false;
}
async function initDB(){
  const lr=lsGet("crew_roster"),lt=lsGet("crew_tonight");
  if(lr)roster=lr; if(lt)tonight=lt; normalize(); render();
  setSave("Saved on this device");
  if(!window.claude||!window.claude.use)return;
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db)return;
  let settled=false;
  const timer=setTimeout(()=>{if(!settled)setSave("Account storage not reachable — saving on this device")},10000);
  for(const which of ["roster","tonight"]){
    db.doc("app/"+which).onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      settled=true;clearTimeout(timer);dbOK=true;
      if(!snap.exists){
        const obj=which==="roster"?roster:tonight;
        const hasLocal=which==="roster"?obj.workers.length:obj.jobs.length;
        if(hasLocal)save(which); else setSave("All changes saved");
        return;
      }
      const data=snap.data();const json=JSON.stringify(data);
      if(json===lastWritten[which])return;
      if(saveTimers[which]||writing[which])return; // local edit in flight wins
      lastWritten[which]=json;
      if(which==="roster")roster=JSON.parse(json);else tonight=JSON.parse(json);
      normalize();lsSet("crew_"+which,which==="roster"?roster:tonight);
      if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();
      if(!snap.metadata||!snap.metadata.fromCache)setSave("All changes saved");
    },err=>{settled=true;clearTimeout(timer);dbOK=false;setSave("Saved on this device")});
  }
}

/* ---------- geo helpers ---------- */
function parseCoords(txt){
  if(!txt)return null;txt=String(txt).trim();
  let m=txt.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if(!m)m=txt.match(/[?&](?:q|ll|query|destination|center)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i);
  if(!m)m=txt.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(!m)m=txt.match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;
  const lat=+m[1],lng=+m[2];
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat,lng};
}
/* ---------- location checks ----------
   Typed addresses sometimes land in the wrong place (address ranges, highway numbers) or only match the town.
   locWarn() explains what looks off so the dispatcher can paste the exact spot from Google Maps. */
const FAR_MI=75;
function typedTown(addr){
  const a=String(addr||"");const zip=(a.match(/\b(\d{5})(?:-\d{4})?\b(?!.*\b\d{5}\b)/)||[])[1]||"";
  const ps=a.split(",").map(x=>x.trim());
  for(let i=1;i<ps.length;i++)if(/^(NC|SC|VA|GA|TN|North Carolina|South Carolina)(\s+\d{5}(-\d{4})?)?(\s+(USA|United States.*))?$/i.test(ps[i])){
    const t=ps[i-1];if(t&&!/\d/.test(t))return {town:t,zip};break}
  return {town:"",zip};
}
function labelPlace(label){
  const ps=String(label||"").split(",").map(x=>x.trim()).filter(Boolean);
  const c=ps.findIndex(x=>/County$/i.test(x));if(c>0)return ps[c-1];
  const st=ps.findIndex(x=>/^(North Carolina|South Carolina|Virginia|Georgia|Tennessee)$/i.test(x));if(st>=2)return ps[st-2];
  return ps[0]||"another place";
}
function locWarn(o,kind){
  if(!o||!hasLoc(o))return "";
  const note=o.geoNote||"";if(/^(Set by hand|Saved spot)/.test(note))return "";
  const full=o.geoLabel||"",label=full||(note.split("Found:")[1]||"").trim();
  const approx=/^Approx/.test(note);const out=[];
  const {town,zip}=typedTown(o.address||o.place||"");
  if(town&&label){
    const L=label.toLowerCase();
    const hit=L.includes(town.toLowerCase())||(zip&&L.includes(zip));

function findRequested(text){

  const out=new Set();

  for(const w of ws){const n=w.name.replace(/\(.*?\)/g,"").trim();if(n.split(" ").length>=2&&wb(n).test(low))out.add(w.id)}
  // after "req", "request(ed)", "need", "use", "crew:", "lead:" — match unique first or last names
  const segs=[...t.matchAll(/\b(?:req(?:uest(?:ed|s)?)?|need(?:s|ed)?|use|send|crew|lead(?:er)?s?|workers?)\b\.?\s*[:\-–]?\s*([^\n;|]+)/gi)].map(m=>m[1]);
  for(const seg of segs){
    for(const tok of seg.split(/,|\/|&|\band\b|\+/i).map(x=>x.trim()).filter(Boolean)){
      const words=tok.toLowerCase().replace(/[^a-z' -]/g," ").split(/\s+/).filter(x=>x.length>1);
      if(!words.length)continue;
      const hit=ws.filter(w=>{const parts=w.name.replace(/\(.*?\)/g,"").toLowerCase().split(/\s+/);return words.every(x=>parts.includes(x))});

  const now=new Date();const today=dayKey(now);
  const tmr=new Date(now);tmr.setDate(tmr.getDate()+1);const tomorrow=dayKey(tmr);
  const from=new Date(now);from.setDate(from.getDate()-2);const fromK=dayKey(from);
  const to=new Date(now);to.setDate(to.getDate()+21);const toK=dayKey(to);
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modalbg";
    const build=()=>{
      const cal=bg.querySelector("#pkCal")?.value||"";
      const pool=evs.filter(e=>!e.header&&(!cal||e.cal===cal));
      const counts={};pool.forEach(e=>{if(e.day)counts[e.day]=(counts[e.day]||0)+1});
      let days=Object.keys(counts).filter(d=>d>=fromK&&d<=toK).sort();
      if(!days.length)days=Object.keys(counts).sort().reverse().slice(0,20);
      const def=days.includes(today)?today:(days.find(d=>d>=today)||days[days.length-1]);
      const lab=d=>{const [y,m,dd]=d.split("-").map(Number);const dt=new Date(y,m-1,dd);return dt.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})+(d===today?" (today)":d===tomorrow?" (tomorrow)":"")};
      bg.querySelector("#pkDay").innerHTML=days.map(d=>`<option value="${d}" ${d===def?"selected":""}>${esc(lab(d))} — ${counts[d]} job${counts[d]>1?"s":""}</option>`).join("")||`<option value="">No dated events found</option>`;
    };
    bg.innerHTML=`<div class="modal"><h3 style="margin-top:0">Which day's jobs?</h3>
      ${cals.length>1?`<label class="f">Calendar</label><select id="pkCal"><option value="">All calendars</option>${cals.map(c=>`<option>${esc(c)}</option>`).join("")}</select>`:""}
      <label class="f">Day</label><select id="pkDay"></select>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="b" data-r="c">Cancel</button><button class="b p" data-r="o">Load jobs</button></div></div>`;
    document.body.appendChild(bg);build();
    bg.querySelector("#pkCal")?.addEventListener("change",build);
    bg.addEventListener("click",e=>{const r=e.target.dataset.r;if(!r)return;
      const day=bg.querySelector("#pkDay").value,cal=bg.querySelector("#pkCal")?.value||"";bg.remove();
      if(r!=="o")return res(null);
      const chosen=evs.filter(x=>(!cal||x.cal===cal)&&(x.day===day));
      chosen.sort((a,b)=>(a.start||"").localeCompare(b.start||""));
      res(chosen);
    });
  });
}

/* Prefer places meant for all-day parking: Park & Ride lots first, then public no-fee lots.
   Store, gas station and restaurant lots are filtered out — they often tow cars left all day. */
const AVOID=/walmart|food lion|harris teeter|lowe'?s|home depot|target|kroger|publix|aldi|lidl|ingles|piggly|dollar|cvs|walgreens|rite aid|mcdonald|burger|wendy|bojangles|hardee|chick|taco|subway|sonic|zaxby|waffle|cracker|gas|fuel|shell|exxon|\bbp\b|citgo|sunoco|marathon|speedway|sheetz|wawa|circle k|kangaroo|7-eleven|quik|\bmart\b|store|shop|mall|plaza|outlet|restaurant|hotel|motel|\binn\b|hospital|apartment|church|school|bank/i;

async function findSpots(pt,home,lead,job){
  const q=`[out:json][timeout:25];(nwr["park_ride"]["park_ride"!="no"](around:16000,${pt.lat},${pt.lng});nwr["amenity"="parking"]["name"~"[Pp]ark.{0,6}[Rr]ide|Commuter|Carpool"](around:16000,${pt.lat},${pt.lng});nwr["amenity"="parking"]["access"~"^(yes|public)$"]["fee"!~"^yes"](around:7000,${pt.lat},${pt.lng});${S().allowStores?`nwr["shop"~"^(supermarket|department_store|wholesale|hardware|doityourself)$"](around:9000,${pt.lat},${pt.lng});nwr["amenity"="fuel"](around:7000,${pt.lat},${pt.lng});`:""});out center tags 80;`;
  let data=null;
  for(const host of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const r=await fetch(host,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});if(r.ok){data=await r.json();break}}catch(e){}
  }
  if(!data)throw new Error("offline");
  const out=[];const seen=new Set();
  for(const e of data.elements||[]){
    const t=e.tags||{};const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;if(lat==null)continue;
    const pr=(t.park_ride&&t.park_ride!=="no")||/park.{0,6}ride|commuter|carpool/i.test(t.name||"");
    const isStore=!!t.shop||t.amenity==="fuel";
    const name=t.name||t.brand||(pr?"Park & Ride lot":isStore?(t.amenity==="fuel"?"Gas station":"Store"):"Public parking lot");
    const avoid=isStore||AVOID.test(name+" "+(t.operator||"")+" "+(t.brand||""));
    if(avoid&&!S().allowStores)continue;
    if(!isStore&&/private|permit|delivery|^no$/i.test(t.access||""))continue;
    if(!isStore&&/customers/i.test(t.access||"")&&!S().allowStores)continue;
    const spot={lat,lng};
    const fromHome=legMiles(home,spot), off=routePoint(spot,lead,job).d*S().roadFactor;
    const key=name+Math.round(lat*200)+Math.round(lng*200);if(seen.has(key))continue;seen.add(key);
    const addr=[t["addr:housenumber"],t["addr:street"],t["addr:city"]].filter(Boolean).join(" ");
    out.push({name:name+(t.operator&&!name.includes(t.operator)&&!avoid?` (${t.operator})`:""),lat,lng,pr,store:avoid,fromHome,off,score:fromHome+off*1.5-(pr?4:0)+(avoid?1.5:0),
      note:[pr?"Park & Ride — made for all-day parking":avoid?"⚠ Store / gas station lot — may tow cars left all day, ask the manager":"Public lot, no fee listed",t.capacity?t.capacity+" spaces":"",t.lit==="yes"?"lit":"",addr].filter(Boolean).join(" · ")});
  }
  out.sort((a,b)=>a.score-b.score);
  return out.slice(0,S().allowStores?8:5);
}

function rMap(jobs){
  const pts=[];jobs.forEach(j=>pts.push(j));availableWorkers().filter(hasLoc).forEach(w=>pts.push(w));
  if(pts.length<2)return "";
  let minLat=Math.min(...pts.map(p=>p.lat)),maxLat=Math.max(...pts.map(p=>p.lat)),minLng=Math.min(...pts.map(p=>p.lng)),maxLng=Math.max(...pts.map(p=>p.lng));
  const k=Math.cos((minLat+maxLat)/2*Math.PI/180);
  let wd=(maxLng-minLng)*k||0.01,ht=(maxLat-minLat)||0.01;
  const Wd=700,pad=24;const Ht=Math.max(220,Math.min(520,Wd*ht/wd));
  const sc=Math.min((Wd-2*pad)/wd,(Ht-2*pad)/ht);
  const X=p=>pad+((p.lng-minLng)*k)*sc+((Wd-2*pad)-wd*sc)/2,Y=p=>pad+(maxLat-p.lat)*sc+((Ht-2*pad)-ht*sc)/2;
  let s=`<details style="margin-top:10px"><summary class="small">Map view</summary><svg class="map" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Map of jobs and worker homes">`;
  jobs.forEach((j,i)=>{trucksFor(j,tonight.assign[j.id]||[]).trucks.forEach(t=>{
    if(t.lead&&hasLoc(t.lead)){const gg=routeGeom(t.lead,j);
      if(gg&&gg.pts.length>1)s+=`<polyline points="${gg.pts.map(p=>X({lat:p[0],lng:p[1]})+","+Y({lat:p[0],lng:p[1]})).join(" ")}" fill="none" stroke="${colorFor(i)}" stroke-width="2.5" opacity=".75"/>`;
      else s+=`<line x1="${X(t.lead)}" y1="${Y(t.lead)}" x2="${X(j)}" y2="${Y(j)}" stroke="${colorFor(i)}" stroke-width="2.5" opacity=".75"/>`;}
    t.crew.forEach(w=>{if(!hasLoc(w))return;const g=legFor(j,w,t);const m=t.lead&&meetFor(w.id,t.lead.id,j.id);const to=m||(g&&g.point)||j;
      s+=`<line x1="${X(w)}" y1="${Y(w)}" x2="${X(to)}" y2="${Y(to)}" stroke="${colorFor(i)}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>`;
      if(g&&g.kind!=="pickup")s+=`<circle cx="${X(to)}" cy="${Y(to)}" r="3.5" fill="${colorFor(i)}"><title>${esc(m?m.name:"Meet "+w.name)}</title></circle>`});
  })});
  const used=assignedIds();
  availableWorkers().filter(hasLoc).forEach(w=>{s+=`<circle cx="${X(w)}" cy="${Y(w)}" r="5" fill="${used.has(w.id)?"var(--card)":"var(--muted)"}" stroke="var(--ink)" stroke-width="1.5"><title>${esc(w.name)} (home)</title></circle>`});
  jobs.forEach((j,i)=>{s+=`<rect x="${X(j)-7}" y="${Y(j)-7}" width="14" height="14" rx="3" fill="${colorFor(i)}"><title>${esc(j.name)}</title></rect><text x="${X(j)+10}" y="${Y(j)+4}" font-size="12" fill="var(--ink)">${esc(j.name.slice(0,22))}</text>`});
  s+=`</svg><div class="small muted">■ jobs &nbsp; ○ homes (grey = not assigned). Solid = lead's truck to job (the real road route once road times are on), dashed = worker to where they join (dot = meet spot).</div></details>`;
  return s;
}

  <div class="card"><h2>📅 History &amp; close-out</h2><p class="small">Each day is saved to <b>History</b> when you tap <b>Copy schedule</b> (or <b>Save to History</b>). If you change crews and copy again, the record updates and the change log shows what moved.</p>
  <p class="small"><b>Next morning:</b> open the day (the app reminds you) and mark each job ✅ Completed, 🌧 Rained out or ❌ Cancelled. Add a note or a crew change — sent home early, no-show, swapped in — so the record shows who actually worked.</p>
  <p class="small"><b>Looking something up:</b> use the calendar, or type a name, client or town in Search. Export any date range as a spreadsheet. On a PC in Chrome or Edge, <b>Connect a history file</b> once and it's updated automatically. History is kept forever and included in <b>Save backup file</b>.</p></div>
  ${rDownloadApp("help")}
  <div class="card" id="relCard" style="order:99"><h2>What's new — release history</h2><p class="small muted" style="margin:0">Tap the version number at the top of any screen to see the latest changes.</p>${relHTML(CHANGELOG)}</div>
  <div class="card"><h2>🤖 AI assistant (optional)</h2><p class="small">With a Claude API key saved under <b>Crew rules → AI assistant</b>: <b>Read job notes with AI</b> pulls trucks, crew size, requested and “don't send” people and important notes out of messy calendar text. After building crews, <b>Review with AI</b> looks for problems and better swaps — type anything special for today (who has to leave early, who to keep off a job) and it takes that into account. Each suggestion has an <b>Apply</b> button; applied people are locked 🔒 so a rebuild keeps them. Only names, jobs, distances and rules are sent — never addresses or phone numbers.</p></div>
  <div class="card"><h2>Having a problem?</h2><p class="small">Go to <b>Crew rules → Pack &amp; save for support</b>. It saves one .zip file with all workers, crew rules, today's jobs, the last calendar import, the crews and a log of recent errors. Send that file along with a note of what went wrong. It contains names, addresses and phone numbers, so only send it to someone you trust.</p></div>
  <div class="card"><h2>How the matching works</h2><p class="small">Each crew lead drives the company truck from their home to the job, and the job's distance is measured from the lead's home. Workers join the truck along the way. If a worker lives on or near the lead's route (within ${S().pickupMiles} mi, set in Crew rules), the lead picks them up at home. Otherwise the worker drives to a point on the lead's route and leaves their car there. So the tool pairs each worker with the lead whose route passes closest to their home, and fills lead spots first, then worker spots.</p>
  <p class="small"><b>Lead range:</b> a crew lead is never sent to a job farther from their home than the max distance in Crew rules (or their own limit, set in their Workers profile). If no available lead is in range, the job shows a note so you can raise a limit or assign someone by hand.</p>
  <p class="small"><b>Meet spots:</b> tap “Pick a meet spot” under a worker to see nearby Park &amp; Ride lots and public parking. Those are meant for leaving a car all day. Store, gas station and restaurant lots (Walmart, Food Lion…) are left out by default because they often tow; tick “Include store &amp; gas station lots” to see them too, marked with a warning. Always check posted signs.</p>
  <p class="small"><b>Requested crew:</b> if a calendar event names people from your roster — full names anywhere, or first/last names after “Req:”, “Request:”, “Need:”, “Crew:” or “Lead:” (e.g. <code>Req: Marcus, Lena</code>) — they're put on that job automatically and tagged “requested”. You can also tap a job and pick requested people by hand. If a requested person is marked off, the job shows a red note.</p>
  <p class="small"><b>Drive times & leave-by times:</b> with a free OpenRouteService key (Crew rules → Road drive times), times come from real roads and speed limits (no live traffic). Each truck's leave time is worked backward from the job's report time: arrive ${esc(S().arriveEarly)} min early, plus ${esc(S().stopMinutes)} min per pickup or meet stop (both adjustable). A lead picks a worker up at home when it adds no more than ${esc(S().pickupMin)} min to the drive. Workers see when to be ready for pickup, or when to leave to meet the truck. Without a key, times are estimates (≈) at ${esc(S().avgMph)} mph.</p>
  <p class="small"> When a calendar title gives only a town, the job is placed at the town's center. The tool never pairs people marked “can't work together”, and leans toward pairs marked “work well together”. Anyone you lock 🔒 stays put when you rebuild.</p></div>`;
}

      if(pl&&pl.leave!=null)t+=`    ${first(tr.lead.name)}: leave ${fmtClock(pl.leave)} → on site ${A}${fmtClock(pl.arrive)}${gl?` (${fmtDur(gl.min)} drive)`:""}\n`;
      tr.crew.forEach(w=>{const g=legFor(j,w,tr);if(!g)return;const pp=pl&&pl.people[w.id]||{};

/* ---------- AI assistant (Claude API) ----------
   The API key is stored only in this browser (localStorage "crew_ai"). It is never saved in backups,
   support packs, or the shared database. Home addresses, phone numbers and map coordinates are never sent. */
const AI_MODELS=[["claude-sonnet-5-5","Claude Sonnet 5.5 — best results (recommended)"],["claude-haiku-5-5","Claude Haiku 5.5 — fastest, cheapest"]];
function aiCfg(){try{return JSON.parse(localStorage.getItem("crew_ai"))||{}}catch(e){return {}}}
function aiSet(c){try{localStorage.setItem("crew_ai",JSON.stringify(c))}catch(e){}}
const aiReady=()=>!!aiCfg().key;
async function askClaude(system,user,maxTokens){
  const c=aiCfg();if(!c.key)throw new Error("Add your Claude API key in Crew rules → AI assistant first.");
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":c.key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:c.model||AI_MODELS[0][0],max_tokens:maxTokens||4000,system,messages:[{role:"user",content:user}]})});
  }catch(e){throw new Error("Couldn't reach Claude. Check the internet connection. (On the shared Claude page AI is blocked — use the website version.)")}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    const m=j&&j.error&&j.error.message||("HTTP "+r.status);
    logEvent("ai-error",`${r.status}: ${m}`);
    if(r.status===401)throw new Error("Claude didn't accept the API key. Check it in Crew rules → AI assistant.");
    if(r.status===429)throw new Error("Claude is busy or the account hit a limit. Try again in a minute.");
    if(r.status===400&&/credit|billing|balance/i.test(m))throw new Error("The Claude API account needs credit. Add some at console.anthropic.com.");
    throw new Error("Claude error: "+m);
  }
  const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  logEvent("ai",`ok ${c.model||AI_MODELS[0][0]}`,{in:j.usage&&j.usage.input_tokens,out:j.usage&&j.usage.output_tokens});
  return text;
}
function parseJSONLoose(t){
  t=String(t||"").replace(/```(?:json)?/gi,"");
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a)throw new Error("Claude's answer wasn't in the expected format. Try again.");
  return JSON.parse(t.slice(a,b+1));
}
/* Map a name Claude wrote back to a roster person */
function personByName(n){
  n=String(n||"").trim().toLowerCase();if(!n)return null;
  const ws=roster.workers;
  let m=ws.filter(w=>w.name.trim().toLowerCase()===n);if(m.length===1)return m[0];
  m=ws.filter(w=>w.name.toLowerCase().replace(/\(.*?\)/g,"").trim()===n);if(m.length===1)return m[0];
  const parts=n.split(/\s+/);
  m=ws.filter(w=>{const wp=w.name.toLowerCase().split(/\s+/);return parts.every(x=>wp.includes(x))});
  return m.length===1?m[0]:null;
}
function jobByRef(ref){
  ref=String(ref||"").trim();if(!ref)return null;
  return tonight.jobs.find(j=>j.id===ref)||tonight.jobs.find(j=>j.name.toLowerCase()===ref.toLowerCase())||null;
}
function rosterForAI(){

/* 1) Read calendar notes: trucks, people per truck, requested people, important notes */
async function aiReadNotes(){
  const jobs=tonight.jobs;if(!jobs.length)return;
  const sys=`You help a dispatcher who schedules field crews. Each job is a calendar event. Every truck has exactly one crew lead plus workers. Read each job's title and notes and pull out ONLY what is stated or clearly implied:
- trucks: number of trucks needed (null if not stated)
- perTruck: people per truck INCLUDING the lead (null if not stated). "3 man crew" means perTruck 3.
- requested: people from the roster the event asks for by name (use the roster spelling; [] if none)
- avoid: people from the roster the event says NOT to send ([] if none)
- note: one short line of anything else the dispatcher must know (time limits, equipment, site rules, "no new guys"), or "" if nothing.
Never guess numbers that aren't there. Reply with JSON only: {"jobs":[{"id":"...","trucks":null,"perTruck":null,"requested":[],"avoid":[],"note":""}]}`;
  const user=`ROSTER:\n${rosterForAI()}\n\nJOBS:\n${jobs.map(j=>JSON.stringify({id:j.id,title:j.title||j.name,notes:j.desc||"",time:j.time||""})).join("\n")}`;
  const out=parseJSONLoose(await askClaude(sys,user,4000));
  let changed=0;const unknown=new Set();
  for(const r of (out.jobs||[])){
    const j=jobByRef(r.id);if(!j)continue;let c=false;
    if(Number.isFinite(+r.trucks)&&+r.trucks>=1&&+r.trucks<=20&&r.trucks!==null&&+r.trucks!==jTrucks(j)){j.trucks=+r.trucks;c=true}
    if(Number.isFinite(+r.perTruck)&&+r.perTruck>=1&&+r.perTruck<=20&&r.perTruck!==null&&+r.perTruck!==jPer(j)){j.crew=+r.perTruck;c=true}
    const req=new Set(j.requested||[]);
    for(const n of (r.requested||[])){const w=personByName(n);if(w){if(!req.has(w.id)){req.add(w.id);c=true}}else unknown.add(n)}
    j.requested=[...req];
    const av=new Set(j.avoid||[]);
    for(const n of (r.avoid||[])){const w=personByName(n);if(w){if(!av.has(w.id)){av.add(w.id);c=true}}else unknown.add(n)}
    j.avoid=[...av];
    const note=String(r.note||"").trim().slice(0,240);
    if(note!==(j.aiNote||"")){j.aiNote=note;c=true}
    if(c)changed++;
  }
  tonight.aiNotesAt=new Date().toISOString();
  save("tonight");render();
  toast(`AI read ${jobs.length} job${jobs.length===1?"":"s"} · ${changed} updated${unknown.size?` · couldn't match: ${[...unknown].slice(0,3).join(", ")}`:""}`);
}

/* 2) Review the built crews, with optional instructions for today */
function crewsForAI(){
  const asg=tonight.assign||{};const used=new Set(Object.values(asg).flat());
  const lines=[];
  for(const j of tonight.jobs){if(!asg[j.id])continue;const c=asg[j.id];
    lines.push(`JOB ${j.id} | ${j.time||""} ${j.name} | ${j.address||""} | needs ${jTrucks(j)} truck(s) x ${jPer(j)} people${(j.requested||[]).length?` | requested: ${j.requested.map(id=>wById(id)?.name).join(", ")}`:""}${(j.avoid||[]).length?` | do not send: ${j.avoid.map(id=>wById(id)?.name).join(", ")}`:""}${j.aiNote?` | note: ${j.aiNote}`:""}`);
    trucksFor(j,c).trucks.forEach((t,k)=>{
      const pl=planTruck(j,t);
      lines.push(`  Truck ${k+1}: ${t.lead?`${t.lead.name} (lead, ${fmtDur(travel(t.lead,j).min)} home→job${pl&&pl.leave!=null?`, leaves ${fmtClock(pl.leave)}, on site ${fmtClock(pl.arrive)}`:""})`:"NO LEAD"}`);
      t.crew.forEach(w=>{const g=legFor(j,w,t);lines.push(`    - ${w.name}${w.lead?" (a lead riding as worker)":""}: ${g?{pickup:`picked up at home (adds ${fmtDur(g.addMin||0)} to the lead's drive)`,meet:`drives ${fmtDur(g.min)} to meet the truck`,atlead:`drives ${fmtDur(g.min)} to the lead's home`,atjob:`drives ${fmtDur(g.min)} to the job`,job:`drives ${fmtDur(g.min)} to the job`}[g.kind]:"no location"}${tonight.locks[w.id]===j.id?" [locked]":""}`)});
    });
    const iss=jobIssues(j,c);if(iss.length)lines.push(`  Problems: ${iss.map(i=>i[1]).join("; ")}`);
  }
  const off=new Set(tonight.off);
  const free=roster.workers.filter(w=>w.active!==false&&!off.has(w.id)&&!used.has(w.id));
  if(free.length){
    lines.push("NOT ASSIGNED (available):");
    for(const w of free){
      let near=tonight.jobs.filter(j=>asg[j.id]&&hasLoc(j)&&hasLoc(w)).map(j=>({j,d:travel(w,j).min})).sort((a,b)=>a.d-b.d).slice(0,3);
      lines.push(`  - ${w.name}${w.lead?" (crew lead)":""}${hasLoc(w)?"":" (no home location)"}${near.length?` — nearest jobs: ${near.map(x=>`${x.j.name} ${fmtDur(x.d)}`).join(", ")}`:""}`);
    }
  }
  return lines.join("\n");
}
async function aiReview(instructions){
  const rules=[...roster.conflicts.map(([a,b])=>`${wById(a)?.name} and ${wById(b)?.name} can NOT work together`),...roster.prefers.map(([a,b])=>`${wById(a)?.name} and ${wById(b)?.name} work well together`)].filter(x=>!/undefined/.test(x));
  const sys=`You are reviewing tomorrow's crew assignments for a field-service dispatcher. Rules of the business:
- Every truck needs exactly one crew lead (they drive the company truck from their home to the job).
- Workers ride with a lead: the lead picks them up if they live on the way, otherwise they drive to meet the truck along the route.
- Never put two people who "can NOT work together" on the same job.
- Requested people should be on the job that requested them; "do not send" people must not be.
- Shorter drives are better, but a full crew with a lead matters more than distance.
- Respect any instructions the dispatcher gives for today.
Drive times are in minutes (road-based when available, otherwise estimates).
Review the assignment. Find real problems and clear improvements only (don't suggest changes that are just as good). Each suggestion must be concrete moves the app can apply.
Move format: {"person":"exact roster name","toJob":"JOB id"} to move/add someone to a job, or {"person":"name","toJob":"unassigned"} to take them off, or {"person":"name","off":true} to mark them off today.
Reply with JSON only:
{"summary":"2-3 plain sentences on how the day looks","suggestions":[{"title":"short","why":"one or two sentences","moves":[...]}],"questions":["anything the dispatcher should double-check"]}
Give at most 6 suggestions, most important first. If everything looks good, say so and return an empty suggestions list.`;
  const user=`${instructions?`DISPATCHER'S INSTRUCTIONS FOR TODAY:\n${instructions}\n\n`:""}CREW RULES:\n${rules.join("\n")||"(none)"}\n\nROSTER:\n${rosterForAI()}\n\nCURRENT CREWS:\n${crewsForAI()}`;
  const out=parseJSONLoose(await askClaude(sys,user,5000));
  tonight.aiReview={stale:false,at:new Date().toISOString(),instructions:instructions||"",summary:String(out.summary||"").slice(0,1200),
    suggestions:(out.suggestions||[]).slice(0,8).map(sg=>({title:String(sg.title||"Suggestion").slice(0,140),why:String(sg.why||"").slice(0,600),moves:(sg.moves||[]).slice(0,12),applied:false})),
    questions:(out.questions||[]).slice(0,5).map(q=>String(q).slice(0,300))};
  save("tonight");render();
}
function applySuggestion(i){
  const sg=tonight.aiReview&&tonight.aiReview.suggestions[i];if(!sg||!tonight.assign)return;
  const bad=[];
  for(const mv of sg.moves){
    const w=personByName(mv.person);if(!w){bad.push(mv.person);continue}
    for(const k in tonight.assign)tonight.assign[k]=tonight.assign[k].filter(x=>x!==w.id);
    delete tonight.locks[w.id];
    if(mv.off){if(!tonight.off.includes(w.id))tonight.off.push(w.id);continue}
    if(String(mv.toJob).toLowerCase()==="unassigned")continue;
    const j=jobByRef(mv.toJob);if(!j||!tonight.assign[j.id]){bad.push(mv.person);continue}
    if(tonight.off.includes(w.id))tonight.off=tonight.off.filter(x=>x!==w.id);
    tonight.assign[j.id].push(w.id);tonight.locks[w.id]=j.id;
  }
  sg.applied=true;logEvent("ai-apply",sg.title);
  save("tonight");render();
  toast(bad.length?`Applied, but couldn't place: ${bad.join(", ")}`:"Applied — those people are locked 🔒 so a rebuild keeps them");
}

/* ---------- history ----------
   One record per day, kept forever. Stored in IndexedDB (falls back to localStorage), included in backups,
   and optionally mirrored to a file on a PC (Chrome/Edge File System Access). Names are copied into each
   record so history still reads correctly after a worker is deleted. */
const HIST=new Map();let histLoaded=false;
const STATUS={done:{label:"Completed",icon:"✅"},rain:{label:"Rained out",icon:"🌧"},cancel:{label:"Cancelled",icon:"❌"}};
const CHANGE_KINDS={home:"Sent home early",noshow:"No-show",swapin:"Swapped in",other:"Other"};
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("crew-scheduler",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("days"))d.createObjectStore("days",{keyPath:"date"});if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv")};r.onsuccess=()=>{IDB.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const st=t.objectStore(store);let out;Promise.resolve(fn(st)).then(v=>out=v);t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(){return new Promise((res,rej)=>{const r=IDB.db.transaction("days").objectStore("days").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  put(rec){return IDB.tx("days","readwrite",st=>{st.put(rec)})},
  del(date){return IDB.tx("days","readwrite",st=>{st.delete(date)})},
  clear(){return IDB.tx("days","readwrite",st=>{st.clear()})},
  get(key){return new Promise((res,rej)=>{const r=IDB.db.transaction("kv").objectStore("kv").get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  set(key,v){return IDB.tx("kv","readwrite",st=>{st.put(v,key)})},
};
let histMode="idb";
async function histInit(){
  try{await IDB.open();(await IDB.all()).forEach(r=>HIST.set(r.date,r))}
  catch(e){histMode="ls";const o=lsGet("crew_history")||{};Object.values(o).forEach(r=>HIST.set(r.date,r));logEvent("history","IndexedDB unavailable, using localStorage")}
  histLoaded=true;
  await fileInit();
  render();
}
async function histPut(rec){
  HIST.set(rec.date,rec);
  if(histMode==="idb"){try{await IDB.put(rec)}catch(e){histMode="ls";logEvent("error","IndexedDB write failed: "+e.message)}}
  if(histMode==="ls"){const o={};HIST.forEach((r,k)=>o[k]=r);lsSet("crew_history",o)}
  fileSync();
}
async function histClear(){
  HIST.clear();
  if(histMode==="idb"){try{await IDB.clear()}catch(e){}}
  try{localStorage.removeItem("crew_history")}catch(e){}
  fileSync();
}
const jobKey=j=>((j.title||j.name||"")+"|"+(j.time||"")).toLowerCase();
const clientOf=j=>{const t=parseJobTitle(j.title||"");return t.client||String(j.name||"").split(" / ")[0]};
const contactOf=j=>{const t=parseJobTitle(j.title||"");return t.contact||String(j.name||"").split(" / ")[1]||""};
function snapshotJobs(){
  const out=[];
  for(const j of tonight.jobs){
    const c=tonight.assign&&tonight.assign[j.id];if(!c)continue;
    const trucks=trucksFor(j,c).trucks.map((t,k)=>({truck:k+1,lead:t.lead?{id:t.lead.id,name:t.lead.name}:null,
      workers:t.crew.map(w=>{const g=legFor(j,w,t);const m=t.lead&&meetFor(w.id,t.lead.id,j.id);const pl=planTruck(j,t);const pp=pl&&pl.people[w.id]||{};
        const tm=pp.ready!=null?" "+fmtClock(pp.ready):pp.meet!=null?" "+fmtClock(pp.meet):"";
        return {id:w.id,name:w.name,how:g?({pickup:"Picked up at home"+tm,meet:(m?"Met truck at "+m.name:"Met truck along the way")+tm,atlead:"Met at lead's home",atjob:"Met at job",job:"Drove to job"}[g.kind]||""):""}})}));
    out.push({key:jobKey(j),time:j.time||"",name:j.name,client:clientOf(j),contact:contactOf(j),title:j.title||"",address:j.address||"",trucks:jTrucks(j),perTruck:jPer(j),note:"",aiNote:j.aiNote||"",status:null,closedAt:null,people:[],crews:trucks});
  }
  return out;
}
const crewSig=jobs=>jobs.map(j=>j.key+":"+j.crews.map(t=>(t.lead?t.lead.name:"-")+"+"+t.workers.map(w=>w.name).sort().join(",")).join("/")).sort().join(";");
function scheduleDay(){return (tonight.jobs.find(j=>j.day)||{}).day||dayKey(new Date())}
function histPeople(jb){return [...jb.crews.flatMap(t=>[t.lead&&t.lead.name,...t.workers.map(w=>w.name)]).filter(Boolean)]}
async function saveDayToHistory(quiet){
  if(!tonight.assign){if(!quiet)toast("Build crews first");return}
  const date=scheduleDay();const now=new Date().toISOString();
  const jobs=snapshotJobs();if(!jobs.length){if(!quiet)toast("No crews to save");return}
  const prev=HIST.get(date);
  const rec=prev?JSON.parse(JSON.stringify(prev)):{date,createdAt:now,saves:0,changes:[],jobs:[]};
  const what=[];
  const prevByKey=new Map((prev?prev.jobs:[]).map(j=>[j.key,j]));
  const merged=jobs.map(nj=>{const pj=prevByKey.get(nj.key);
    if(pj){prevByKey.delete(nj.key);
      const a=new Set(histPeople(pj)),b=new Set(histPeople(nj));
      const add=[...b].filter(x=>!a.has(x)),rem=[...a].filter(x=>!b.has(x));
      if(add.length||rem.length)what.push(`${nj.name}: ${[...add.map(x=>"+"+x),...rem.map(x=>"−"+x)].join(", ")}`);
      return {...nj,note:pj.note||"",status:pj.status||null,closedAt:pj.closedAt||null,people:pj.people||[]};
    }
    if(prev)what.push(`Added ${nj.name}`);
    return nj;});
  for(const pj of prevByKey.values()){if(!pj.dropped)what.push(`${pj.name} no longer on the schedule`);merged.push({...pj,dropped:true})}
  rec.jobs=merged;rec.saves=(rec.saves||0)+1;rec.updatedAt=now;rec.appVersion=APP_VERSION;
  if(!prev)rec.changes.push({at:now,what:"Schedule saved"});
  else if(what.length)rec.changes.push({at:now,what:"Schedule resent — "+what.join("; ")});
  tonight.histSaved={date,sig:crewSig(jobs),at:now};save("tonight");
  await histPut(rec);
  logEvent("history",`saved ${date} (${jobs.length} jobs)`);
  render();
  if(!quiet)toast(prev?(what.length?"History updated with the changes":"History already up to date"):"Saved to History");
}
function histUnsaved(){
  if(!tonight.assign)return false;

let fileHandle=null,fileState="none",fileLast=null; // none | ok | reconnect | unsupported
const fileSupported=()=>typeof window.showSaveFilePicker==="function"&&window.self===window.top;
async function fileInit(){

function historyJSON(){return JSON.stringify({app:"crew-scheduler",kind:"history",version:1,exportedAt:new Date().toISOString(),appVersion:APP_VERSION,days:[...HIST.values()].sort((a,b)=>a.date.localeCompare(b.date))},null,1)}
let fileBusy=false,fileAgain=false;
async function fileSync(){
  if(!fileHandle||fileState!=="ok")return;
  if(fileBusy){fileAgain=true;return}
  fileBusy=true;
  try{const w=await fileHandle.createWritable();await w.write(historyJSON());await w.close();fileLast=new Date().toISOString()}
  catch(e){fileState="reconnect";logEvent("error","History file write failed: "+e.message);render()}
  fileBusy=false;if(fileAgain){fileAgain=false;fileSync()}
}
async function fileConnect(){
  try{
    const h=await window.showSaveFilePicker({suggestedName:"Crew History.json",types:[{description:"Crew history",accept:{"application/json":[".json"]}}]});
    fileHandle=h;fileState="ok";if(histMode==="idb"){try{await IDB.set("histFile",h)}catch(e){logEvent("history","couldn't remember file handle: "+e.message)}}
    // if the chosen file already has history (e.g. from another PC), merge it in first
    try{const t=await (await h.getFile()).text();if(t.trim()){const n=mergeHistory(JSON.parse(t).days||[]);if(n)toast(`Merged ${n} day(s) from the file`)}}catch(e){}
    await fileSync();logEvent("history","file connected");render();toast("History file connected — it updates automatically");
  }catch(e){if(e&&e.name!=="AbortError")toast("Couldn't connect the file: "+e.message)}
}
async function fileReconnect(){
  try{const p=await fileHandle.requestPermission({mode:"readwrite"});fileState=p==="granted"?"ok":"reconnect";if(fileState==="ok")await fileSync();render()}catch(e){toast("Couldn't reconnect: "+e.message)}
}
async function fileDisconnect(){fileHandle=null;fileState="none";if(histMode==="idb"){try{await IDB.set("histFile",null)}catch(e){}}render()}
/* merge days from a backup or history file: newer edits win, nothing is deleted */
function mergeHistory(days){
  let n=0;
  for(const d of (days||[])){
    if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!Array.isArray(d.jobs))continue;
    const cur=HIST.get(d.date);
    if(!cur||(d.updatedAt||"")>(cur.updatedAt||"")){HIST.set(d.date,d);n++;
      if(histMode==="idb")IDB.put(d).catch(()=>{});}
  }
  if(n&&histMode==="ls"){const o={};HIST.forEach((r,k)=>o[k]=r);lsSet("crew_history",o)}
  if(n)fileSync();
  return n;
}

function rHistSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return "";
  const rows=[];
  [...HIST.values()].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>r.jobs.forEach(j=>{
    const people=histPeople(j).concat((j.people||[]).map(p=>p.name));
    const hay=[j.name,j.client,j.contact,j.title,j.address,j.note,...people].join(" ").toLowerCase();
    if(terms.every(t=>hay.includes(t)))rows.push({r,j});
  }));

function historyCSV(from,to){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Date","Day","Time","Client","Contact","Job","Location","Status","Truck","Role","Person","How they got there","Crew change","Job note"]];
  [...HIST.values()].filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const day=dLabel(r.date,{weekday:"short"});
    r.jobs.forEach(j=>{
      const st=j.dropped?"Not on final schedule":j.status?STATUS[j.status].label:"Not closed out";
      const chg=n=>(j.people||[]).filter(p=>p.name===n).map(p=>(CHANGE_KINDS[p.kind]||p.kind)+(p.note?": "+p.note:"")).join("; ");
      const base=[r.date,day,j.time,j.client,j.contact,j.name,j.address,st];
      j.crews.forEach(t=>{
        rows.push([...base,t.truck,"Lead",t.lead?t.lead.name:"(no lead)","Drove truck",t.lead?chg(t.lead.name):"",j.note]);
        t.workers.forEach(w=>rows.push([...base,t.truck,"Worker",w.name,w.how,chg(w.name),j.note]));
      });
      const inCrew=new Set(histPeople(j));
      (j.people||[]).filter(p=>!inCrew.has(p.name)).forEach(p=>rows.push([...base,"","Worker",p.name,"",(CHANGE_KINDS[p.kind]||p.kind)+(p.note?": "+p.note:""),j.note]));
    });
  });
  return rows.map(r=>r.map(q).join(",")).join("\n");
}

function workersCSV(){

  const rows=[["Name","Address","Lat","Lng","Phone","Lead","Active","Max miles"]];
  [...roster.workers].sort((a,b)=>a.name.localeCompare(b.name)).forEach(w=>rows.push([w.name,w.address||"",hasLoc(w)?w.lat:"",hasLoc(w)?w.lng:"",w.phone||"",w.lead?"yes":"",w.active===false?"no":"yes",w.maxMiles||""]));

function readBackup(text){
  let d;try{d=JSON.parse(String(text||"").replace(/^\uFEFF/,"").trim())}catch(e){throw new Error("That isn't a Crew Scheduler backup.")}
  const r=d&&(d.roster||(Array.isArray(d.workers)?d:null));
  if(!r||!Array.isArray(r.workers))throw new Error("That isn't a Crew Scheduler backup.");
  const clean=w=>({id:String(w.id||uid()),name:String(w.name||"Unnamed").slice(0,80),address:String(w.address||"").slice(0,200),
    lat:typeof w.lat==="number"&&Math.abs(w.lat)<=90?w.lat:null,lng:typeof w.lng==="number"&&Math.abs(w.lng)<=180?w.lng:null,
    phone:String(w.phone||"").slice(0,40),lead:!!w.lead,active:w.active!==false,maxMiles:+w.maxMiles>0?+w.maxMiles:0,geoNote:w.geoNote?String(w.geoNote).slice(0,200):"",geoLabel:w.geoLabel?String(w.geoLabel).slice(0,300):""});
  const pairs=a=>Array.isArray(a)?a.filter(p=>Array.isArray(p)&&p.length===2).map(p=>[String(p[0]),String(p[1])]):[];
  return {workers:r.workers.map(clean),conflicts:pairs(r.conflicts),prefers:pairs(r.prefers),settings:r.settings&&typeof r.settings==="object"?r.settings:null,
    places:Object.fromEntries(Object.entries(d.places&&typeof d.places==="object"?d.places:{}).filter(([k,v])=>v&&isFinite(+v.lat)&&isFinite(+v.lng)&&Math.abs(+v.lat)<=90&&Math.abs(+v.lng)<=180).map(([k,v])=>[String(k).slice(0,200),{lat:+v.lat,lng:+v.lng,name:String(v.name||"").slice(0,80),at:String(v.at||"")}])),historyDays:d.history&&Array.isArray(d.history.days)?d.history.days:[]};
}
/* Rows left behind when a backup .json was opened with "Import list (CSV)" before 2026.11.09-g:
   names like "{", "]", "name: Curtis danley", "lat: 35.03", "roster: {". */
const JUNK_ROW=/^[\[\]{}(),\s]*$|^"?[A-Za-z]+"?\s*:(\s|$)/;
const isJunkWorker=w=>JUNK_ROW.test(String(w.name||"").trim())&&!w.address&&!hasLoc(w);
async function restoreRoster(text){
  let b;try{b=readBackup(text)}catch(e){logEvent("restore-error",e.message);toast(e.message);return}
  const junk=roster.workers.filter(isJunkWorker);
  if(junk.length){
    const ids=new Set(junk.map(w=>w.id));
    roster.workers=roster.workers.filter(w=>!ids.has(w.id));
    roster.conflicts=roster.conflicts.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));roster.prefers=roster.prefers.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));
    logEvent("restore",`Removed ${junk.length} broken rows from an earlier backup import`);
    save("roster");render();
  }
  const mode=roster.workers.length?await ask(`This backup has ${b.workers.length} worker${b.workers.length===1?"":"s"}. Replace everyone on this device with it, or merge (add new people, update people with the same name)?`,"Replace","Merge"):true;
  if(mode===null)return;
  if(mode){
    roster.workers=b.workers;roster.conflicts=b.conflicts;roster.prefers=b.prefers;
    if(b.settings)roster.settings={...DEFAULT_SETTINGS,...b.settings};
    tonight.assign=null;tonight.locks={};
  } else {
    const idMap=new Map();let added=0,updated=0;
    for(const w of b.workers){
      const ex=roster.workers.find(x=>x.id===w.id)||roster.workers.find(x=>x.name.trim().toLowerCase()===w.name.trim().toLowerCase());
      if(ex){idMap.set(w.id,ex.id);const keep=ex.id;Object.assign(ex,w,{id:keep});updated++}
      else{const nid=roster.workers.some(x=>x.id===w.id)?uid():w.id;idMap.set(w.id,nid);roster.workers.push({...w,id:nid});added++}
    }
    const addPairs=(src,dst)=>{for(const [a,c] of src){const A=idMap.get(a),C=idMap.get(c);if(A&&C&&A!==C&&!dst.some(p=>pairKey(p[0],p[1])===pairKey(A,C)))dst.push([A,C])}};
    addPairs(b.conflicts,roster.conflicts);addPairs(b.prefers,roster.prefers);
    toast(`${added} added, ${updated} updated`);
  }
  let pn=0;for(const [k,v] of Object.entries(b.places||{})){if(!places[k]||String(places[k].at||"")<v.at){places[k]=v;pn++}}if(pn)lsSet("crew_places",places);
  const hn=mergeHistory(b.historyDays);if(hn)setTimeout(()=>toast(`Also restored ${hn} day(s) of history`),2700);
  logEvent("restore",(mode?"replace":"merge")+` ${b.workers.length} workers, ${hn} history days`);
  normalize();save("roster");save("tonight");render();
  if(mode)toast(`Restored ${b.workers.length} worker${b.workers.length===1?"":"s"} and their crew rules`);
}

      const requested=[...document.querySelectorAll("#jfReq .chip")].filter(c=>!c.classList.contains("off")).map(c=>c.dataset.id);
      let jid=editingJob;const hadLoc=editingJob!=="new"&&hasLoc(jById(editingJob)||{});
      const fg=c&&formGeo&&Math.abs(c.lat-formGeo.lat)<1e-5&&Math.abs(c.lng-formGeo.lng)<1e-5?formGeo:null;formGeo=null;
      if(editingJob==="new"){jid=uid();tonight.jobs.push({id:jid,name,time,address:addr,lat:c?c.lat:null,lng:c?c.lng:null,geoNote:fg?fg.geoNote:(c?"Set by hand":""),geoLabel:fg?fg.geoLabel:"",desc:"",folder:"",crew,trucks,requested,on:true})}
      else{const j=jById(editingJob);const moved=!c||!hasLoc(j)||Math.abs(c.lat-j.lat)>1e-6||Math.abs(c.lng-j.lng)>1e-6;Object.assign(j,{name,time,address:addr,lat:c?c.lat:null,lng:c?c.lng:null,crew,trucks,requested});if(fg){j.geoNote=fg.geoNote;j.geoLabel=fg.geoLabel}else if(moved){j.geoNote=c?"Set by hand":"";j.geoLabel=""}}
      if(c&&!fg&&addr&&placeSave(addr,c.lat,c.lng,name))toast("Saved — this spot will be used next time for "+addr.split(",")[0]);
      if(!c&&addr&&hadLoc)placeForget(addr);   // location cleared on purpose: look it up fresh
      editingJob=null;save("tonight");render();
      if(!c&&addr)geocodeMissing("jobs",jid);
      break;}
    case "jobOn":{const j=jById(id);j.on=el.checked;save("tonight");break;}
    case "delJob":tonight.jobs=tonight.jobs.filter(j=>j.id!==id);if(tonight.assign)delete tonight.assign[id];for(const k in tonight.locks)if(tonight.locks[k]===id)delete tonight.locks[k];save("tonight");render();break;

        const m=j.durations?.[0]?.[0],d=j.distances?.[0]?.[0];routePauseUntil=0;routeLastErr="";toast(m!=null?`✅ Working — Fayetteville → Raeford: ${fmtDur(m/60)}, ${fmtMi(d)} mi`:"Connected, but no route came back")}
      catch(e){toast(routeErrText(e))}

    case "clearAsg":tonight.assign=null;tonight.locks={};save("tonight");render();break;
    case "delCrews":if(await ask("Clear today's crews? Jobs, workers and rules stay.","Clear crews")){tonight.assign=null;tonight.locks={};tonight.meets={};delete tonight.aiReview;logEvent("delete","crews");save("tonight");render();toast("Today's crews cleared")}break;
    case "delDay":if(await ask("Clear today's jobs, crews and who's-off list? Workers and rules stay.","Clear day")){tonight={jobs:[],assign:null,locks:{},off:[],importedAt:null,source:""};logEvent("delete","day");save("tonight");render();toast("Today cleared")}break;

    case "histStatus":{const d=el.dataset.d,i=+el.dataset.i,k=el.dataset.s;const r=HIST.get(d);const j=r&&r.jobs[i];if(!j)break;const off=j.status===k;

    case "histDelChange":{const d=el.dataset.d,i=+el.dataset.i,k=+el.dataset.k;const pc=HIST.get(d).jobs[i].people[k];await histEdit(d,c=>{c.jobs[i].people.splice(k,1)},`Removed crew change: ${pc.name} — ${CHANGE_KINDS[pc.kind]||pc.kind}`);break;}
    case "histCsv":{const f=$("#hxFrom").value,t=$("#hxTo").value;const csv=historyCSV(f,t);if(csv.split("\n").length<2){toast("No saved days in that range");break}download(`crew-history-${f||"start"}-to-${t||"end"}.csv`,csv);break;}

    case "fileConnect":fileConnect();break;

    case "fileDisconnect":fileDisconnect();break;
    case "delHistory":{const r=await ask(`Delete all ${HIST.size} saved day${HIST.size===1?"":"s"} of history? This can't be undone.`,"Delete history","Save history first");
      if(r===false){download(`crew-history-${dayKey(new Date())}.json`,historyJSON());break}if(!r)break;await histClear();logEvent("delete","history");render();toast("History deleted");break;}
    case "spot":pickSpot(el.dataset.w,el.dataset.j);break;
    case "lock":{const w=el.dataset.w,j=el.dataset.j;if(tonight.locks[w]===j)delete tonight.locks[w];else tonight.locks[w]=j;save("tonight");render();break;}
    case "unassign":{const w=el.dataset.w,j=el.dataset.j;tonight.assign[j]=tonight.assign[j].filter(x=>x!==w);delete tonight.locks[w];save("tonight");render();break;}
    case "addWorker":editingWorker="new";formGeo=null;render();setTimeout(()=>$("#wfName")?.focus(),0);break;
    case "editWorker":editingWorker=id;formGeo=null;render();setTimeout(()=>$("#wfName")?.scrollIntoView({block:"center"}),0);break;
    case "cancelWorker":editingWorker=null;render();break;
    case "openAddr":{const ad=$("#wfAddr").value.trim();if(!ad){toast("Type the address first");return}
      const url="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(ad);
      const link=document.createElement("a");link.href=url;link.target="_blank";link.rel="noopener";document.body.appendChild(link);link.click();link.remove();break;}
    case "saveWorker":{
      const name=$("#wfName").value.trim();if(!name){toast("Name is required");return}
      const lt=$("#wfLoc").value.trim();const c=parseCoords(lt);
      if(lt&&!c){toast("Couldn't read that location — paste like 40.01, -82.98");return}
      const data={name,address:$("#wfAddr").value.trim(),lat:c?c.lat:null,lng:c?c.lng:null,phone:$("#wfPhone").value.trim(),lead:$("#wfLead").checked,active:$("#wfActive").checked,maxMiles:Math.max(0,parseFloat($("#wfMax").value)||0)};
      let wid=editingWorker;
      const fg=c&&formGeo&&Math.abs(c.lat-formGeo.lat)<1e-5&&Math.abs(c.lng-formGeo.lng)<1e-5?formGeo:null;formGeo=null;
      if(fg){data.geoNote=fg.geoNote;data.geoLabel=fg.geoLabel}
      let handSet=false;const hadLoc=editingWorker!=="new"&&hasLoc(wById(editingWorker)||{});
      if(editingWorker==="new"){wid=uid();roster.workers.push({id:wid,...data})}else{const ow=wById(editingWorker);if(!fg&&c&&hasLoc(ow)&&(Math.abs(c.lat-ow.lat)>1e-6||Math.abs(c.lng-ow.lng)>1e-6)){data.geoNote="Set by hand";data.geoLabel="";handSet=true}Object.assign(ow,data)}
      if(handSet&&data.address)placeSave(data.address,c.lat,c.lng,name);
      if(!c&&data.address&&hadLoc)placeForget(data.address);
      editingWorker=null;save("roster");render();
      if(!c&&data.address)geocodeMissing("workers",wid);
      break;}
    case "delWorker":{const w=wById(editingWorker);if(!w)return;if(!await ask(`Delete ${w.name}? Their crew rules are removed too.`,"Delete"))return;
      roster.workers=roster.workers.filter(x=>x.id!==w.id);roster.conflicts=roster.conflicts.filter(p=>!p.includes(w.id));roster.prefers=roster.prefers.filter(p=>!p.includes(w.id));
      if(tonight.assign)for(const k in tonight.assign)tonight.assign[k]=tonight.assign[k].filter(x=>x!==w.id);delete tonight.locks[w.id];
      tonight.jobs.forEach(j=>{if(j.requested)j.requested=j.requested.filter(x=>x!==w.id)});
      editingWorker=null;save("roster");save("tonight");render();break;}
    case "addPair":{const k=el.dataset.k;const A=$(k==="c"?"#cA":"#pA").value,B=$(k==="c"?"#cB":"#pB").value;
      if(!A||!B||A===B){toast("Pick two different people");return}

      const other=k==="c"?roster.prefers:roster.conflicts;const oi=other.findIndex(p=>pairKey(p[0],p[1])===pairKey(A,B));if(oi>=0)other.splice(oi,1);
      arr.push([A,B]);save("roster");render();break;}

document.addEventListener("change",e=>{

  if(el.dataset.act==="jobCrew"){const j=jById(el.dataset.id);j.crew=Math.max(1,+el.value||1);save("tonight");if(tonight.assign)render();return}
  if(el.dataset.act==="jobTrucks"){const j=jById(el.dataset.id);j.trucks=Math.max(1,+el.value||1);save("tonight");if(tonight.assign)render();return}
  if(el.dataset.act==="assignTo"){const wid=el.value,jid=el.dataset.j;if(!wid)return;
    for(const k in tonight.assign)tonight.assign[k]=tonight.assign[k].filter(x=>x!==wid);
    tonight.assign[jid].push(wid);tonight.locks[wid]=jid;save("tonight");render();return}
  if(el.dataset.set){const k=el.dataset.set;roster.settings[k]=el.type==="checkbox"?el.checked:Math.max(0,parseFloat(el.value)||0);if(k==="roadFactor"&&roster.settings[k]<1)roster.settings[k]=1;if(k==="defaultCrew"&&roster.settings[k]<1)roster.settings[k]=1;if(k==="avgMph"&&roster.settings[k]<5)roster.settings[k]=5;save("roster");if(tonight.assign&&tab==="tonight")render();return}

});
